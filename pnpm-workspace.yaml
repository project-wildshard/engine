# P3: one package; scripts and the build mirror read node_modules/.pnpm.
packages:
  - .
enableGlobalVirtualStore: false
packageExtensions:
  postprocessing:
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
  n8ao:
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
  navcat:
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
