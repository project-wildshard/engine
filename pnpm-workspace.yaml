# P3: one package. GVS G9 (J230): installs link into pnpm's global virtual store; scripts and the build mirror
# read through node_modules links (G4). confirmModulesPurge: false lets a classic checkout move over without a TTY.
packages:
  - .
enableGlobalVirtualStore: true
confirmModulesPurge: false
packageExtensions:
  postprocessing:
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
  n8ao:
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
  navcat:
    peerDependencies:
      '@types/three': '*'
    peerDependenciesMeta:
      '@types/three':
        optional: true
