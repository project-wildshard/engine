/* ─── Wildshard UI base ─── dark glass, cyan accents, Rajdhani display / JetBrains Mono data ───
   ONLY shared primitives live here: tokens, page resets, .ws-glass / .ws-label / .ws-mono / .ws-display /
   .ws-wordmark / .ws-bar / .ws-progress and the keyframes. Everything else is sculpted per screen in a sibling file with
   its own class prefix (game.css → ws-game-, menu.css → ws-menu-, …); scripts/check-css.mjs enforces it. */
:root {
  /* top edge of the HUD on phones: 6px from the top of the page. The page never runs under the status bar — not in the
     Safari tab, and not as a home-screen PWA either since E58 dropped viewport-fit=cover (see index.html) — so the inset is
     0 on phones; it stays in the formula for any device that still reports one. `html.standalone` (index.html) is set for
     anything that needs to know the mode explicitly. */
  --ws-top: calc(env(safe-area-inset-top, 0px) + 6px);
  --ws-cyan: #8fe3ff;
  --ws-cyan-dim: rgba(143, 227, 255, 0.55);
  --ws-cyan-line: rgba(143, 227, 255, 0.35);
  --ws-cyan-faint: rgba(143, 227, 255, 0.14);
  --ws-glass: rgba(6, 10, 18, 0.55);
  --ws-glass-deep: rgba(6, 10, 18, 0.78);
  --ws-text: #e6f2f8;
  --ws-text-dim: rgba(196, 220, 232, 0.6);
  --ws-red: #ff5a4a;
  --ws-amber: #ffb547;
  --ws-display: 'Rajdhani', 'Bahnschrift', 'DIN Alternate', sans-serif;
  --ws-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
}

/* overflow: clip, NOT hidden (E58): in an iOS home-screen web app drawn under the status bar, `overflow: hidden` on html /
   body was one of the triggers that made WebKit shrink the viewport a status bar short (~62 px) a second after load — the
   black strip under the control bar and the title (bisected in the iOS 26.5 simulator: hidden → 812 of 874 px, clip →
   872). The boot loader's relayout triggered it too, so the real cure is index.html's viewport without viewport-fit=cover;
   clip stays because it still keeps the page from ever scrolling without making it a scroll container. */
html, body { margin: 0; padding: 0; overflow: clip; height: 100%; background: #050810; touch-action: manipulation; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
/* #game and #hud are sized by --ws-vh (src/client/engine/core/viewport.ts: the real height — an iOS home-screen app reports 100vh / innerHeight
   a status bar short and left a black strip over the home indicator, E46); fixed, so body's overflow clip can't cut them */
#game { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: var(--ws-vh, 100vh); touch-action: none; }
#hud button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
/* overflow: clip, not hidden: hidden made #hud a scroll container, and the speed-streak layers' negative insets (gridHud.css
   .ws-grid-speed inset -12%, game.css .ws-game-speed) gave it ~82 px to scroll; Chromium's scroll-into-view before a tap slid
   the whole HUD up under the finger (the release smoke's HOVER tap, 2026-10-29). clip clips the same and can never scroll. */
#hud { position: fixed; inset: 0 0 auto; height: var(--ws-vh, 100%); pointer-events: none; font-family: var(--ws-mono); color: var(--ws-text); user-select: none; overflow: clip; }
#hud * { box-sizing: border-box; }
/* FC14 (G911): the phone's HUD glass is flat. A backdrop blur re-samples the live canvas under every chip, disc and panel
   each frame the world draws; a desktop keeps it */
#hud.touch, #hud.touch * { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* Loading screen facts panel (src/client/engine/ui/Loading.ts). Base panel/wordmark styles live in hud.css. */
/* base */
.ws-load { position: fixed; inset: 0; z-index: calc(var(--ws-layer-hud) + 20); font-family: var(--ws-mono); color: var(--ws-text); background: radial-gradient(ellipse at 50% 30%, #0d1a26 0%, #06090f 60%, #030508 100%); display: flex; flex-direction: column; justify-content: space-between; user-select: none; transition: opacity 0.25s ease; }
/* A fresh-page handoff also covers a running page's title/menu layer. */
.ws-load[data-navigation] { z-index: calc(var(--ws-layer-menu) + 1); opacity: 1; transition: none; pointer-events: auto; }
.ws-load.hide { opacity: 0; pointer-events: none; }
.ws-load .ws-load-play { display: block; width: 100%; min-height: 48px; margin-top: 18px; border: 1px solid var(--ws-cyan); background: rgba(9, 22, 36, 0.88); color: var(--ws-cyan); font: 700 18px var(--ws-display); letter-spacing: 0.18em; cursor: pointer; touch-action: manipulation; }
.ws-load .ws-load-play:focus-visible { outline: 2px solid var(--ws-cyan); outline-offset: 3px; }
.ws-load[data-hold] .ws-load-head, .ws-load[data-hold] .ws-load-foot { flex-shrink: 0; }
.ws-load[data-hold] .ws-load-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
.ws-load[data-hold] .ws-load-panel { flex-shrink: 0; }
.ws-load[data-hold] .ws-load-play { flex: none; align-self: center; width: calc(100% - 32px); max-width: 560px; margin: 8px 16px 14px; }
/* QA row 11 (Jake, 2026-11-12: "lol screen alyout bug"): on desktop the ready card, COPY DIAGNOSTICS and PLAY are one centred
   column with margins, the group centred between the wordmark and the foot. The hold body used to say align-items: flex-start
   (meant for the scroll axis), which pinned the 560 px card and COPY flush to the left edge while PLAY sat alone at the bottom */
@media (min-width: 701px) {
  .ws-load[data-hold] .ws-load-body { flex: 0 1 auto; margin-top: auto; padding: 16px 32px 0; align-items: center; justify-content: flex-start; }
  .ws-load[data-hold] .ws-load-play { margin: 16px auto auto; }
}
.ws-load::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(180deg, rgba(3, 8, 15, 0.62), rgba(3, 8, 15, 0.84) 54%, rgba(3, 8, 15, 0.93)), var(--ws-load-portrait); background-position: center; background-size: cover; pointer-events: none; }
.ws-load::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(143, 227, 255, 0.025) 0 1px, transparent 1px 3px); pointer-events: none; }
.ws-load .ws-load-head, .ws-load .ws-load-body, .ws-load .ws-load-foot, .ws-load .ws-load-play { position: relative; z-index: calc(var(--ws-layer-hud) + 1); }
.ws-load .ws-load-head { padding: 34px 44px 0; }
.ws-load .ws-wordmark { font-family: var(--ws-display); font-weight: 700; font-size: 54px; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; }
.ws-load .ws-wordmark b { color: var(--ws-cyan); }
.ws-load .ws-load-tagline { margin-top: 10px; font-size: 13px; letter-spacing: 0.04em; color: var(--ws-text-dim); }
.ws-load .ws-load-body { flex: 1; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; }
.ws-load .ws-load-hold { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; width: calc(100% - 32px); max-width: 560px; min-height: 52px; padding: 12px 16px; appearance: none; -webkit-appearance: none; border: 1px solid var(--ws-cyan-line); background: var(--ws-glass-deep); color: var(--ws-text-dim); font: 11px var(--ws-mono); letter-spacing: 0.18em; text-transform: uppercase; text-align: left; cursor: pointer; touch-action: manipulation; transition: border-color 0.18s, color 0.18s, background 0.18s; }
/* G875 (Jake: "a nicer toggle button"): the hold is an on / off switch, label left, a pill and knob right (the Settings switch's pill, loading-card size) */
.ws-load .ws-load-hold .ws-gmenu-swlabel { flex: 1 1 auto; min-width: 0; }
.ws-load .ws-load-hold .ws-gmenu-pill { position: relative; flex: none; width: 44px; height: 24px; border-radius: 12px; background: rgba(6, 10, 18, 0.7); border: 1px solid rgba(143, 227, 255, 0.35); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5); transition: background 0.18s, border-color 0.18s, box-shadow 0.18s; }
.ws-load .ws-load-hold .ws-gmenu-pill::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ws-text-dim); transition: transform 0.18s, background 0.18s; }
.ws-load .ws-load-hold.on { border-color: var(--ws-cyan); background: rgba(143, 227, 255, 0.08); color: #fff; }
.ws-load .ws-load-hold.on .ws-gmenu-pill { background: rgba(143, 227, 255, 0.28); border-color: var(--ws-cyan); box-shadow: 0 0 12px rgba(143, 227, 255, 0.35), inset 0 0 6px rgba(143, 227, 255, 0.25); }
.ws-load .ws-load-hold.on .ws-gmenu-pill::after { transform: translateX(20px); background: var(--ws-cyan); box-shadow: 0 0 8px var(--ws-cyan); }
.ws-load .ws-load-hold[hidden] { display: none; }
/* LS4 (J188): Copy diagnostics takes Hold's place once the game is ready, the same box with its label centred */
.ws-load .ws-load-copy { flex: none; display: block; width: calc(100% - 32px); max-width: 560px; min-height: 52px; padding: 12px 16px; appearance: none; -webkit-appearance: none; border: 1px solid var(--ws-cyan-line); background: var(--ws-glass-deep); color: #fff; font: 12px var(--ws-mono); letter-spacing: 0.22em; text-transform: uppercase; text-align: center; cursor: pointer; touch-action: manipulation; }
.ws-load .ws-load-copy:focus-visible { outline: 2px solid var(--ws-cyan); outline-offset: 3px; }
/* QA 30 (Jake 2026-11-10: "You can't like regret loading the wrong shard and bail out"): SETTINGS and EXIT TO TITLE, a row of
   their own under the card; Exit leaves for a fresh title page (src/client/engine/ui/Loading.ts menuRow) */
.ws-load .ws-load-menu { flex: none; display: flex; gap: 10px; width: calc(100% - 32px); max-width: 560px; }
.ws-load .ws-load-menu button { flex: 1 1 0; min-width: 0; min-height: 48px; padding: 10px 12px; appearance: none; -webkit-appearance: none; border: 1px solid var(--ws-cyan-line); background: var(--ws-glass-deep); color: var(--ws-cyan); font: 11px var(--ws-mono); letter-spacing: 0.2em; text-transform: uppercase; text-align: center; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.ws-load .ws-load-menu button:focus-visible { outline: 2px solid var(--ws-cyan); outline-offset: 3px; }
.ws-load .ws-load-menu button:disabled { opacity: 0.5; cursor: default; }
.ws-load .ws-load-retry { flex: none; min-height: 44px; padding: 8px 16px; border: 1px solid var(--ws-cyan); color: var(--ws-cyan); background: var(--ws-glass-deep); font: 12px var(--ws-mono); cursor: pointer; }
.ws-load .ws-load-retry[hidden] { display: none; }
.ws-load .ws-load-foot { align-items: center; gap: 12px; }
.ws-load .ws-load-panel { box-sizing: border-box; width: 560px; padding: 22px 26px 20px; }
.ws-load .ws-load-title { font-family: var(--ws-display); font-weight: 700; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #fff; }
.ws-load .ws-load-title b { color: var(--ws-cyan); }
.ws-load .ws-load-meta { margin: 14px 0 18px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; row-gap: 7px; }
.ws-load .ws-load-meta div { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px solid rgba(143, 227, 255, 0.08); padding-bottom: 5px; }
.ws-load .ws-load-meta span:first-child { color: var(--ws-text-dim); letter-spacing: 0.16em; font-size: 9.5px; text-transform: uppercase; }
.ws-load .ws-load-bar { height: 4px; background: rgba(143, 227, 255, 0.12); position: relative; overflow: hidden; }
.ws-load .ws-load-fill { height: 100%; width: 0; background: linear-gradient(90deg, rgba(143, 227, 255, 0.6), var(--ws-cyan)); box-shadow: 0 0 12px rgba(143, 227, 255, 0.6); transition: width 0.1s linear; }
.ws-load .ws-load-log { margin-top: 12px; font-size: 9.5px; letter-spacing: 0.08em; color: rgba(196, 220, 232, 0.4); min-height: 70px; line-height: 1.6; }
.ws-load .ws-load-foot { display: flex; justify-content: space-between; padding: 0 44px 26px; font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(196, 220, 232, 0.4); }
.ws-load[data-stalled="true"] [data-el="foot"] { color: #ffcd73; }
/* QS2: a long fault (a file path) wraps; at its unbreakable min-content width it pushed RETRY off a 402 px screen */
.ws-load [data-el="foot"] { min-width: 0; overflow-wrap: anywhere; }

/* panel */
.ws-load .ws-load-meta-1 { grid-template-columns: 1fr; margin: 10px 0 8px; }
/* LS5 (J188): time left keeps its row from the first frame, so it appears without moving the card; hidden until honest */
.ws-load .ws-load-meta .ws-load-left:not([data-shown]) { visibility: hidden; }
.ws-load .ws-load-meta .ws-load-left[hidden] { display: none; }
.ws-load .ws-load-title { display: flex; align-items: baseline; }
.ws-load .ws-load-title b { margin-left: 6px; }
.ws-load .ws-load-clock { margin-left: auto; font-family: var(--ws-mono); font-size: 13px; letter-spacing: 0.08em; color: var(--ws-cyan); font-weight: 400; }
/* LS2 (J188, density 2): Start, Download and Load. Only the running phase shows its rows; a tap on a head opens the others. */
.ws-load .ws-load-phase { margin-top: 14px; }
.ws-load .ws-load-phase[hidden] { display: none; }
.ws-load .ws-load-phase > .ws-load-track-row { width: 100%; margin: 0 0 7px; padding: 0; border: 0; background: none; appearance: none; -webkit-appearance: none; color: inherit; font: inherit; font-size: 10.5px; text-align: left; cursor: pointer; touch-action: manipulation; }
.ws-load .ws-load-phase > .ws-load-track-row .ws-load-track-name::before { content: '▸'; display: inline-block; width: 1.4em; font-size: 0.8em; }
.ws-load .ws-load-phase[data-open] > .ws-load-track-row .ws-load-track-name::before { content: '▾'; }
.ws-load .ws-load-phase[data-state='on'] .ws-load-track-name { color: var(--ws-cyan); }
.ws-load .ws-load-phase[data-state='on'] .ws-load-track-fact { color: #fff; }
.ws-load .ws-load-phase:not([data-open]) .ws-load-log, .ws-load .ws-load-phase:not([data-open]) .ws-load-grid { display: none; }
.ws-load .ws-load-title .ws-load-kicker { flex: none; white-space: nowrap; }
.ws-load .ws-load-title b { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-load .ws-load-clock { flex: none; padding-left: 10px; }
.ws-load .ws-load-track-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; }
.ws-load .ws-load-grid { margin: 8px 0 0; }
.ws-load .ws-load-track-row[hidden] { display: none; }
.ws-load .ws-load-track-name { width: 96px; color: var(--ws-cyan-dim); flex: none; white-space: nowrap; }
.ws-load .ws-load-track-fact { flex: 1; color: var(--ws-text-dim); text-transform: none; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-load .ws-load-track-pct { color: #fff; font-family: var(--ws-display); font-size: 18px; letter-spacing: 0.04em; width: 58px; text-align: right; flex: none; }
.ws-load .ws-load-track-pct::after { content: '%'; font-size: 11px; margin-left: 2px; color: var(--ws-text-dim); }
.ws-load .ws-load-log { margin-top: 10px; min-height: 0; }
.ws-load .ws-load-log:empty { display: none; }
.ws-load .ws-load-log div { display: flex; gap: 10px; align-items: baseline; font-size: 10.5px; letter-spacing: 0.06em; line-height: 1.75; color: rgba(196, 220, 232, 0.7); }
.ws-load .ws-load-log div.on { color: var(--ws-cyan-dim); }
.ws-load .ws-load-log .ws-load-row-label { flex: none; }
.ws-load .ws-load-log .ws-load-row-detail { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(196, 220, 232, 0.6); }
.ws-load .ws-load-log div.on .ws-load-row-detail { color: #fff; }
.ws-load .ws-load-log .ws-load-row-ms { flex: none; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
@media (max-width: 600px) {
  .ws-load .ws-load-track-name { width: 88px; }
  .ws-load .ws-load-track-fact { font-size: 10px; }
  .ws-load .ws-load-log { min-height: 0; }
}

/* phone: the panel fills the width, the head and foot tighten, safe areas respected */
@media (max-width: 700px) {
  .ws-load .ws-load-head { padding: calc(44px + env(safe-area-inset-top, 0px)) 16px 0; } /* clears the build pill top-right */
  .ws-load .ws-wordmark { font-size: 34px; letter-spacing: 0.06em; }
  .ws-load .ws-load-tagline { font-size: 11px; }
  .ws-load .ws-load-body { padding: 12px 16px; align-items: flex-start; }
  .ws-load .ws-load-panel { width: 100%; padding: 16px 14px 14px; }
  .ws-load .ws-load-title { font-size: 16px; }
  .ws-load .ws-load-clock { font-size: 12px; }
  .ws-load .ws-load-meta { grid-template-columns: 1fr; margin: 10px 0 12px; }
  .ws-load .ws-load-meta div { font-size: 10.5px; }
  .ws-load .ws-load-foot { padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 8.5px; letter-spacing: 0.14em; }
  .ws-load .ws-load-hold, .ws-load .ws-load-copy, .ws-load .ws-load-menu { width: 100%; }
}

      /* QA10: iOS 26+ draws its soft scroll-edge blur under the status bar of a home-screen app unless WebKit finds a
         fixed, coloured container at the top-centre of the viewport (4 px down). In play that point was the Developer fps
         chip (fixed, too small to count), so the blur washed out PAUSE / fps / minimap until the pause menu opened. This

    <script>
      // iOS Safari: no rubber-band scroll of the fixed page, no pinch zoom — the game owns every gesture.
      document.addEventListener('touchmove', (e) => { if (!e.target.closest('[data-scroll]')) e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      // home-screen PWA vs Safari tab: the page runs under the status bar only in standalone mode (CSS --ws-top handles the offset)
      if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
      // The loader uses a small, already-approved portrait of the selected shard from its first paint.
      // Whitelist the filename: ?chunk is a shard selector, never an arbitrary asset path.
      const loadShard = homeParams.get('chunk') || 'driftwood-isle';
      if (['driftwood-isle', 'pine-hollow', 'nalati-grasslands', 'nine-dragon-stack'].includes(loadShard)) {
        document.documentElement.style.setProperty('--ws-load-portrait', 'url("' + titleAssetURLs['/assets/title/' + loadShard + '-portrait.jpg'] + '")');
      }
      // Developer mode controls the hold switch, frame meter and build id.
      // Loading progress stays detailed for everyone (G846). No URL switch (E162).
      try { if (JSON.parse(localStorage.getItem('wildshard.save.v2@1.device') || '{}').keys?.devMode?.data === true) document.documentElement.setAttribute('data-dev', ''); } catch { /* storage blocked: player mode */ }
    </script>

<div class="ws-wordmark">Project <b>Wildshard</b></div>
<div class="ws-load-tagline">A world that does not exist yet, arriving one chunk at a time.</div>
</div>
<div class="ws-load-body">

    <!-- data-loading-first-paint: buildIdentity.mjs keeps Vite's hoisted sheet non-blocking for this shell -->
    <script data-loading-first-paint>
      // RL3 (Jake: "reload should just reload the page"): one self-reload. A page whose entry modules have not arrived 12 s
      // after it started (no data-booted: a hung module fetch) reloads once a session; a slow boot that runs is left alone.
      setTimeout(() => {
        const pending = document.getElementById('ws-loading-shell');
        if (document.documentElement.hasAttribute('data-booted') || !document.querySelector('[data-title-shell]') || !(document.querySelector('.ws-load[data-shell]') || pending instanceof HTMLTemplateElement && pending.content.querySelector('.ws-load[data-shell]'))) return;
        try { // the session save key boot.selfReload (src/client/engine/saves/slots.ts), shared with stuck.ts's one retry
          const doc = JSON.parse(sessionStorage.getItem('wildshard.save.v2@1.session') || '{"keys":{}}');
          if (doc.keys?.['boot.selfReload']) return;
          (doc.keys ??= {})['boot.selfReload'] = { v: 1, data: String(Date.now()) }; sessionStorage.setItem('wildshard.save.v2@1.session', JSON.stringify(doc));
        } catch { return; }
        location.reload();
      }, 12000);
    </script>
    <script data-loading-clock>
      // DL21 (E526): before any module arrives, a world page's card runs its clock from the title tap (the fresh arrival the
      // tap stored) and names the shard and tier; Loading adopts the card (data-shell goes) and keeps the same clock.
      (() => {
        // Apply the existing arrival metadata to a detached card. No parser or
        // network yield can paint the default place before this atomic insert.
        const template = document.getElementById('ws-loading-shell');
        try {
        const card = template instanceof HTMLTemplateElement ? template.content.querySelector('.ws-load[data-shell]') : document.querySelector('.ws-load[data-shell]'), slug = new URLSearchParams(location.search).get('chunk');
        const field = name => card.querySelector('[data-el="' + name + '"]'), entry = (store, scope, key) => { try { const item = JSON.parse(store().getItem('wildshard.save.v2@1.' + scope) || '{}').keys?.[key]?.data; return typeof item === 'string' ? JSON.parse(item) : item; } catch { return null; } };
        if (!card || !slug) return;
        const found = [entry(() => sessionStorage, 'session', 'titleArrival'), entry(() => localStorage, 'device', 'titleArrival.once')].find(a => a?.slug === slug && Date.now() - a.at < 60000);
        // Adopt the clock's existing parsed handoff; no extra storage read on boot.
        if (found?.timing && window.__bootTiming) window.__bootTiming.handoff = {...found.timing,wall:found.at,received:performance.now(),newTimeOrigin:window.__bootTiming.timeOrigin,source:'title-arrival-clock-read',validated:false};
        const start = found ? Math.min(0, found.at - performance.timeOrigin) : 0, clock = field('clock');
        card.dataset.clockStartedAt = String(start); if (found?.name) field('slug').textContent = found.name; if (found?.tier) field('tier').textContent = found.tier;
        // LS6: the destination's own art from the first frame (a grid tap resumes elsewhere than its page's shard); ARRIVAL_ART's rule
        if (typeof found?.art === 'string' && /^(?:\/(?!\/)[\w./-]+\.(?:jpg|png|webp))?$/u.test(found.art)) document.documentElement.style.setProperty('--ws-load-portrait', found.art === '' ? 'none' : 'url("' + found.art + '")');
        const paint = () => { const s = (performance.now() - start) / 1000; clock.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + (s % 60).toFixed(1).padStart(4, '0'); };
        // LS2/LS3: Start's bar takes one share per completed LS1 boundary of START_STEPS (src/client/engine/boot/shell.ts),
        // never time; one additional share counts completed code body bytes from the compiler inventory.
        const steps = ['app:document-and-module-graph', 'app:page-entry-import', 'app:tables-import-and-prepare', 'app:tier-menu-download-imports', 'app:three-import', 'app:main-import', 'app:selected-discovery'];
        const startFact = field('stFact'), startPct = field('stPct'), startBar = field('stBar');
        // Compiler-owned decoded body sizes, not transfer sizes or a timing estimate.
        const moduleRows = JSON.parse(document.getElementById('boot-module-files')?.textContent || '{}').common || [];
        const modules = new Map(moduleRows.map(([url, bytes]) => [new URL(url, location.href).href, bytes]));
        const moduleTotal = [...modules.values()].reduce((sum, bytes) => sum + bytes, 0);
        const startPaint = () => {
          const t = window.__bootTiming; if (!t) return;
          const done = steps.filter(op => t.entries.some(e => e.operation === op && e.end !== null && e.result === 'complete'));
          const received = new Map();
          for (const row of t.resources) if (row.realm === 'page' && modules.has(row.url) && row.decodedBodySize > 0) received.set(row.url, Math.min(modules.get(row.url), row.decodedBodySize));
          const moduleBytes = [...received.values()].reduce((sum, bytes) => sum + bytes, 0);
          const fraction = moduleTotal > 0 ? (done.length + moduleBytes / moduleTotal) / (steps.length + 1) : done.length / steps.length;
          const pct = String(Math.floor(fraction * 100));
          if (startPct.textContent !== pct) { startPct.textContent = pct; startBar.style.width = pct + '%'; }
          let files = 0, bytes = 0; for (const r of t.resources) if (r.realm === 'page') { files++; bytes += r.transferSize || 0; }
          if (moduleTotal > 0) {
            startFact.textContent = received.size + ' / ' + modules.size + ' code files · ' + (moduleBytes / 1e6).toFixed(1) + ' / ' + (moduleTotal / 1e6).toFixed(1) + ' MB';
            card.dataset.startBytes = String(moduleBytes); card.dataset.startTotalBytes = String(moduleTotal); card.dataset.startFiles = String(received.size);
          } else if (files > 0) startFact.textContent = files + ' files · ' + (bytes / 1e6).toFixed(1) + ' MB';
          card.dataset.step = 'start.' + (steps.find(op => !done.includes(op)) || 'hand-off');
        };
        paint(); startPaint(); const tick = setInterval(() => { if (card.hasAttribute('data-shell')) { paint(); startPaint(); } else clearInterval(tick); }, 100);
      } catch { /* the module's clock (shell.ts startShellClock) still runs */ }
      finally { if (template instanceof HTMLTemplateElement) template.replaceWith(template.content); } })();
    </script>
