# Ring 2 / J167: one exact SHA, all pinned heads. Ring 3 follows a green report.
# Promotion owns tags (J184); a red or incomplete verdict holds the tag.
name: nightly
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      suite_only:
        description: Diagnose both suite partitions only (no head or release qualification)
        type: boolean
        default: false
      ring3_only:
        description: Diagnose the Ring 3 sender only (does not qualify Ring 2 or a release)
        type: boolean
        default: false
      diagnostic_head:
        description: Diagnose one committed head only (no nightly qualification)
        type: string
        default: ''
      diagnostic_browser:
        description: Browser for the single-head diagnostic
        type: choice
        options: [chromium, webkit]
        default: chromium
      pins_channel:
        description: Reviewed pin snapshot to test (staging release hash awaits AP-26)
        type: choice
        options: [production, staging]
        default: production
env:
  WILDSHARD_PIN_CHANNEL: ${{ inputs.pins_channel || 'production' }}
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-${{ github.ref }}${{ inputs.suite_only && '-suite-diagnostic' || '' }}${{ inputs.diagnostic_head && format('-head-{0}-{1}', inputs.diagnostic_head, inputs.diagnostic_browser) || '' }}
  cancel-in-progress: false
jobs:
  ring3:
    if: always() && !inputs.diagnostic_head && (needs.report.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.ring3_only))
    needs: report
    uses: ./.github/workflows/ring-3.yml
    with:
      engine: ${{ github.sha }}
    secrets:
      NIGHTLY_APP_CLIENT_ID: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
      NIGHTLY_APP_PRIVATE_KEY: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
  plan:
    if: ${{ !inputs.ring3_only && !inputs.diagnostic_head }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: node --test scripts/nightly.proof.ts
      - if: env.WILDSHARD_PIN_CHANNEL == 'staging'
        run: node scripts/pins-staging.ts select
      - id: plan
        run: echo "matrix=$(node scripts/nightly.ts plan)" >> "$GITHUB_OUTPUT"
  tests:
    if: ${{ !inputs.diagnostic_head }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pins
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node scripts/pins.ts install
      # Save admitted immutable inputs before a red product can end the job.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.pins.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/pins
          key: ${{ steps.pins.outputs.cache-primary-key }}
      - run: pnpm gen:inputs
      - name: Choose a bounded replayable network fuzz seed
        run: echo "NET_FUZZ_SEEDS=$(node scripts/nightly-seed.ts "$GITHUB_RUN_ID")" >> "$GITHUB_ENV"
      - run: node scripts/nightly.ts tests
        env:
          NIGHTLY_TEST_GROUP: ${{ matrix.group }}
          WS_FULL_SUITE: '1'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-tests-${{ matrix.group }}
          path: tmp/nightly/reports/tests-*.json
          if-no-files-found: error
          retention-days: 7
  heads:
    if: ${{ !inputs.suite_only && !inputs.diagnostic_head }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.browser }} heads ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pins
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node scripts/pins.ts install
      # Save admitted immutable inputs before a red product can end the job.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.pins.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/pins
          key: ${{ steps.pins.outputs.cache-primary-key }}
      - run: bash scripts/ci-playwright-install.sh ${{ matrix.browser }}
      # Pure input-addressed encodes are reusable; each head's cook store remains cold.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: encodes
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: nightly-encodes-${{ github.sha }}
          restore-keys: |
            nightly-encodes-
            ring1-spawn-parts-br-
      - run: pnpm build:game
      # Save after a good build even when a later cold-head proof goes red.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.encodes.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ${{ steps.encodes.outputs.cache-primary-key }}
      # PAGE-SIZE PZ4: build:game splits dist/ from dist-content/; this job serves the whole game from dist.
      - run: node scripts/app-build/splitOutput.mjs dist --join
      - name: Cold cook and real phone UI on each pinned head
        run: scripts/browser-lane.sh node scripts/nightly-heads.ts "${BROWSER}" "${GROUP}"
        env:
          BROWSER: ${{ matrix.browser }}
          GROUP: ${{ matrix.group }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-heads-${{ matrix.browser }}-${{ matrix.group }}
          path: tmp/nightly/reports/heads-*.json
          if-no-files-found: error
          retention-days: 7
  report:
    if: always() && !inputs.ring3_only && !inputs.suite_only && !inputs.diagnostic_head
    needs: [plan, tests, heads]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          merge-multiple: true
          path: tmp/nightly/reports
      - name: Read the previous completed nightly, including red runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp/nightly/reports
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty') || echo '::warning::Previous run lookup unavailable'
          if [ -n "$previous" ]; then
            gh run download "$previous" --name nightly-verdict --dir tmp/nightly/baseline || echo '::warning::Previous verdict unavailable; summary will say so'
          fi
      - if: env.WILDSHARD_PIN_CHANNEL == 'staging'
        run: node scripts/pins-staging.ts select
      - name: Refuse a red or incomplete night (J167)
        if: always()
        run: node scripts/nightly.ts report tmp/nightly/reports tmp/nightly/baseline/verdict.json
        env:
          NIGHTLY_PLAN_RESULT: ${{ needs.plan.result }}
          NIGHTLY_TESTS_RESULT: ${{ needs.tests.result }}
          NIGHTLY_HEADS_RESULT: ${{ needs.heads.result }}
      - name: Publish the per-head verdict
        if: always()
        run: cat tmp/nightly/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-verdict
          path: |
            tmp/nightly/reports/verdict.json
            tmp/nightly/reports/summary.md
          if-no-files-found: error
          retention-days: 7

  head-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_head != ''
    runs-on: ${{ inputs.diagnostic_browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      NIGHTLY_HEAD: ${{ inputs.diagnostic_head }}
      NIGHTLY_BROWSER: ${{ inputs.diagnostic_browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Refuse a head outside the committed nightly pins
        id: head
        run: |
          node --test scripts/nightly-head-group.proof.ts
          echo "group=$(node scripts/nightly-head-group.ts "$NIGHTLY_HEAD")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node scripts/pins.ts install
      - run: bash scripts/ci-playwright-install.sh "$NIGHTLY_BROWSER"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: nightly-encodes-${{ github.sha }}
          restore-keys: |
            nightly-encodes-
            ring1-spawn-parts-br-
      - run: pnpm build:game
      - run: node scripts/app-build/splitOutput.mjs dist --join
      - name: Exercise the production cold-pack and phone path
        env:
          NIGHTLY_GROUP: ${{ steps.head.outputs.group }}
        run: node scripts/nightly-heads.ts "$NIGHTLY_BROWSER" "$NIGHTLY_GROUP" tmp/nightly/reports "$NIGHTLY_HEAD"
      - name: Keep diagnostic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-head-diagnostic
          path: tmp/nightly/reports/heads-*.json
          if-no-files-found: warn
          retention-days: 7
