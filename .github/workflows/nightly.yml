# Ring 2 / J167: one exact main SHA, all pinned heads, no deployment or app token.
# Promotion owns tags (J184); a red or incomplete verdict holds the tag.
name: nightly
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: node --test scripts/nightly.proof.ts
      - id: plan
        run: echo "matrix=$(node scripts/nightly.ts plan)" >> "$GITHUB_OUTPUT"
  tests:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pins
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node scripts/pins.ts install
      # Save admitted immutable inputs before a red product can end the job.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.pins.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/pins
          key: ${{ steps.pins.outputs.cache-primary-key }}
      - run: pnpm gen:inputs
      - run: node scripts/nightly.ts tests
        env:
          WS_FULL_SUITE: '1'
          NET_FUZZ_SEEDS: ${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-tests
          path: tmp/nightly/reports/tests.json
          if-no-files-found: error
          retention-days: 7
  heads:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.browser }} heads ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pins
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node scripts/pins.ts install
      # Save admitted immutable inputs before a red product can end the job.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.pins.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/pins
          key: ${{ steps.pins.outputs.cache-primary-key }}
      - run: bash scripts/ci-playwright-install.sh ${{ matrix.browser }}
      - run: pnpm build:game
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Cold cook and real phone UI on each pinned head
        run: scripts/browser-lane.sh node scripts/nightly-heads.ts "${BROWSER}" "${GROUP}"
        env:
          BROWSER: ${{ matrix.browser }}
          GROUP: ${{ matrix.group }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-heads-${{ matrix.browser }}-${{ matrix.group }}
          path: tmp/nightly/reports/heads-*.json
          if-no-files-found: error
          retention-days: 7
  report:
    if: always()
    needs: [plan, tests, heads]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          merge-multiple: true
          path: tmp/nightly/reports
      - name: Read the previous completed nightly, including red runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp/nightly/reports
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty') || echo '::warning::Previous run lookup unavailable'
          if [ -n "$previous" ]; then
            gh run download "$previous" --name nightly-verdict --dir tmp/nightly/baseline || echo '::warning::Previous verdict unavailable; summary will say so'
          fi
      - name: Refuse a red or incomplete night (J167)
        if: always()
        run: node scripts/nightly.ts report tmp/nightly/reports tmp/nightly/baseline/verdict.json
        env:
          NIGHTLY_PLAN_RESULT: ${{ needs.plan.result }}
          NIGHTLY_TESTS_RESULT: ${{ needs.tests.result }}
          NIGHTLY_HEADS_RESULT: ${{ needs.heads.result }}
      - name: Publish the per-head verdict
        if: always()
        run: cat tmp/nightly/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-verdict
          path: |
            tmp/nightly/reports/verdict.json
            tmp/nightly/reports/summary.md
          if-no-files-found: error
          retention-days: 7
