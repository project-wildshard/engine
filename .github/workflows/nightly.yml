# Ring 2 / J167: one exact SHA, all pinned heads. Ring 3 follows a green report.
# Promotion owns tags (J184); a red or incomplete verdict holds the tag.
name: nightly
# TC22 also accepts an on-demand run of the same production Ring 2.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pins_channel == 'production'
  && !inputs.suite_only && !inputs.ring3_only && !inputs.cook_cache_only && !inputs.api_health_only
  && !inputs.diagnostic_head && !inputs.diagnostic_drill && 'nightly release proof' || 'nightly' }}
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      suite_only:
        description: Diagnose the suite partitions only (no head or release qualification)
        type: boolean
        default: false
      ring3_only:
        description: Diagnose the Ring 3 sender only (does not qualify Ring 2 or a release)
        type: boolean
        default: false
      api_health_only:
        description: Diagnose the validator version only (does not qualify Ring 2 or a release)
        type: boolean
        default: false
      cook_cache_only:
        description: Diagnose real cook-cache reuse only (does not qualify Ring 2 or a release)
        type: boolean
        default: false
      diagnostic_head:
        description: Diagnose one committed head only (no nightly qualification)
        type: string
        default: ''
      diagnostic_browser:
        description: Browser for the single-head diagnostic
        type: choice
        options: [chromium, webkit]
        default: chromium
      diagnostic_drill:
        description: Run baseline, lost hover control, and healed on the diagnostic head only
        type: boolean
        default: false
      pins_channel:
        description: Reviewed pin snapshot to test (staging release hash awaits AP-26)
        type: choice
        options: [production, staging]
        default: production
env:
  WILDSHARD_PIN_CHANNEL: ${{ inputs.pins_channel || 'production' }}
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-${{ github.ref }}${{ inputs.suite_only && '-suite-diagnostic' || '' }}${{ inputs.cook_cache_only && '-cook-cache-diagnostic' || '' }}${{ inputs.api_health_only && '-api-health-diagnostic' || '' }}${{ inputs.diagnostic_head && format('-head-{0}-{1}', inputs.diagnostic_head, inputs.diagnostic_browser) || '' }}${{ inputs.diagnostic_drill && '-fault-drill' || '' }}
  cancel-in-progress: false
jobs:
  ring3:
    if: always() && !inputs.cook_cache_only && !inputs.api_health_only && !inputs.diagnostic_head && !inputs.diagnostic_drill && (needs.report.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.ring3_only))
    needs: report
    # QA-FEEDBACK-2026-11-23-b row 40: ring-3 pushes the packed candidate it sends (ring3/<engine>)
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/ring-3.yml
    with:
      engine: ${{ github.sha }}
    secrets:
      NIGHTLY_APP_CLIENT_ID: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
      NIGHTLY_APP_PRIVATE_KEY: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
  plan:
    if: ${{ !inputs.ring3_only && !inputs.cook_cache_only && !inputs.api_health_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      diagnostic_group: ${{ steps.diagnostic.outputs.group }}
      diagnostic_os: ${{ steps.diagnostic.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: node --test src/scripts/nightly.proof.ts
      - if: env.WILDSHARD_PIN_CHANNEL == 'staging'
        run: node src/scripts/pins-staging.ts select
      # MACBOOK-WAITS MW1 (api-server AP-26): the reviewed snapshot must be the release staging serves.
      - if: env.WILDSHARD_PIN_CHANNEL == 'staging'
        run: node src/scripts/pins-staging.ts verify
      - id: plan
        if: ${{ !inputs.diagnostic_head && !inputs.diagnostic_drill }}
        run: |
          echo "matrix=$(node src/scripts/nightly.ts plan)" >> "$GITHUB_OUTPUT"
          echo "test_matrix=$(node src/scripts/nightly.ts test-plan)" >> "$GITHUB_OUTPUT"
      - name: Select the diagnostic head's production group and runner
        id: diagnostic
        if: ${{ inputs.diagnostic_head || inputs.diagnostic_drill }}
        env:
          NIGHTLY_HEAD: ${{ inputs.diagnostic_head }}
          NIGHTLY_BROWSER: ${{ inputs.diagnostic_browser }}
        run: |
          node --test src/scripts/nightly-head-group.proof.ts
          route=$(node src/scripts/nightly-head-group.ts "$NIGHTLY_HEAD" "$NIGHTLY_BROWSER")
          jq -r '"group=\(.group)\nos=\(.os)"' <<< "$route" >> "$GITHUB_OUTPUT"
  tests:
    if: ${{ !inputs.cook_cache_only && !inputs.api_health_only && !inputs.diagnostic_head && !inputs.diagnostic_drill }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pins
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node src/scripts/pins.ts install
      # Save admitted immutable inputs before a red product can end the job.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.pins.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/pins
          key: ${{ steps.pins.outputs.cache-primary-key }}
      - run: pnpm gen:inputs
      - name: Choose a bounded replayable network fuzz seed
        run: echo "NET_FUZZ_SEEDS=$(node src/scripts/nightly-seed.ts "$GITHUB_RUN_ID")" >> "$GITHUB_ENV"
      - run: node src/scripts/nightly.ts tests
        env:
          NIGHTLY_TEST_GROUP: ${{ matrix.group }}
          WS_FULL_SUITE: '1'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-tests-${{ matrix.group }}
          path: tmp/nightly/reports/tests-*.json
          if-no-files-found: error
          retention-days: 7
  # EV6: run the three original-file contention rehearsals under one outer
  # machine grant on a dedicated runner. Their nested proofs stay out of the
  # local full gate. Ring 2 requires the actual cases in its serial partition.
  native-contention:
    if: ${{ github.event_name == 'schedule' || inputs.suite_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      WS_LANE_NAME: native-contention
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - run: node src/scripts/pins.ts install && pnpm gen:inputs
      - name: Choose a bounded replayable network fuzz seed
        run: echo "NET_FUZZ_SEEDS=$(node src/scripts/nightly-seed.ts "$GITHUB_RUN_ID")" >> "$GITHUB_ENV"
      - run: node src/scripts/.kit/scratch-dir.mjs ci-native-contention 'Serial native CPU-admission rehearsals'
      - name: Prove all three original files queue and pass in order
        id: serial
        run: |
          set -o pipefail
          node src/scripts/native-contention-proof.mjs tmp/ci-native-contention | tee tmp/ci-native-contention/result.json
      - name: Flag an incomplete serial rehearsal
        if: ${{ always() && steps.serial.outcome != 'success' }}
        run: |
          echo '::warning::Native contention rehearsal failed or did not run. Inspect the native-contention-serial job and its evidence.'
          echo 'Native contention rehearsal needs attention. See the native-contention job and native-contention-serial artifact.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-contention-serial
          path: |
            tmp/ci-native-contention/result.json
            tmp/ci-native-contention/run-*/native-*.log
          retention-days: 7
          if-no-files-found: ignore
  heads:
    if: ${{ !inputs.cook_cache_only && !inputs.api_health_only && !inputs.suite_only && !inputs.diagnostic_head && !inputs.diagnostic_drill }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.browser }} heads ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pins
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node src/scripts/pins.ts install
      # Save admitted immutable inputs before a red product can end the job.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.pins.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/pins
          key: ${{ steps.pins.outputs.cache-primary-key }}
      - run: bash src/scripts/ci-playwright-install.sh ${{ matrix.browser }}
      # Pure input-addressed encodes are reusable; each head's cook store remains cold.
      # FS30 (J505): ci's verified full-ledger parts first, so a full build never re-encodes them (the Ring 1
      # subset alone sent the nightly's Chromium heads into an 1800 s re-encode).
      - name: Key the full-ledger encodes
        id: ledger-key
        uses: ./.github/actions/full-ledger-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: encodes
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: nightly-encodes-${{ github.sha }}
          restore-keys: |
            ${{ steps.ledger-key.outputs.prefix }}
            ${{ steps.ledger-key.outputs.linux-key }}
            ${{ steps.ledger-key.outputs.linux-prefix }}
            nightly-encodes-
            ring1-spawn-parts-br-
      - run: pnpm build:game
      # Save after a good build even when a later cold-head proof goes red.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.encodes.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ${{ steps.encodes.outputs.cache-primary-key }}
      # PAGE-SIZE PZ4: build:game splits dist/ from dist-content/; this job serves the whole game from dist.
      - run: node src/scripts/app-build/splitOutput.mjs dist --join
      - name: Cold cook and real phone UI on each pinned head
        # The job's 75-minute limit includes setup. The shared Mac's 60-minute
        # default stopped the hosted Chromium lane during a bounded Pine cook.
        run: src/scripts/browser-lane.sh --max 75 node src/scripts/nightly-heads.ts "${BROWSER}" "${GROUP}"
        env:
          BROWSER: ${{ matrix.browser }}
          GROUP: ${{ matrix.group }}
          # TC22: Playwright relays the browser's stderr (a GPU-process exit) into each failed head's browser-log.json
          DEBUG: pw:browser
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-heads-${{ matrix.browser }}-${{ matrix.group }}
          path: |
            tmp/nightly/reports/heads-*.json
            tmp/nightly/reports/failures/**/*.json
          if-no-files-found: error
          retention-days: 7
  report:
    if: always() && !inputs.cook_cache_only && !inputs.api_health_only && !inputs.ring3_only && !inputs.suite_only && !inputs.diagnostic_head && !inputs.diagnostic_drill
    needs: [plan, tests, heads]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-*
          merge-multiple: true
          path: tmp/nightly/reports
      - name: Read the previous completed nightly, including red runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp/nightly/reports
          previous=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?branch=main&event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty') || echo '::warning::Previous run lookup unavailable'
          if [ -n "$previous" ]; then
            gh run download "$previous" --name nightly-verdict --dir tmp/nightly/baseline || echo '::warning::Previous verdict unavailable; summary will say so'
          fi
      - if: env.WILDSHARD_PIN_CHANNEL == 'staging'
        run: node src/scripts/pins-staging.ts select
      - name: Refuse a red or incomplete night (J167)
        if: always()
        run: node src/scripts/nightly.ts report tmp/nightly/reports tmp/nightly/baseline/verdict.json
        env:
          NIGHTLY_PLAN_RESULT: ${{ needs.plan.result }}
          NIGHTLY_TESTS_RESULT: ${{ needs.tests.result }}
          NIGHTLY_HEADS_RESULT: ${{ needs.heads.result }}
      - name: Publish the per-head verdict
        if: always()
        run: cat tmp/nightly/reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-verdict
          path: |
            tmp/nightly/reports/verdict.json
            tmp/nightly/reports/summary.md
          if-no-files-found: error
          retention-days: 7

  head-diagnostic:
    if: github.event_name == 'workflow_dispatch' && !inputs.cook_cache_only && !inputs.api_health_only && (inputs.diagnostic_head != '' || inputs.diagnostic_drill)
    needs: plan
    runs-on: ${{ needs.plan.outputs.diagnostic_os }}
    timeout-minutes: 75
    env:
      NIGHTLY_HEAD: ${{ inputs.diagnostic_head }}
      NIGHTLY_BROWSER: ${{ inputs.diagnostic_browser }}
      NIGHTLY_DRILL: ${{ inputs.diagnostic_drill && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node src/scripts/pins.ts install
      - run: bash src/scripts/ci-playwright-install.sh "$NIGHTLY_BROWSER"
      # FS30 (J505): ci's verified full-ledger parts first, so a full build never re-encodes them (the Ring 1
      # subset alone sent the nightly's Chromium heads into an 1800 s re-encode).
      - name: Key the full-ledger encodes
        id: ledger-key
        uses: ./.github/actions/full-ledger-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: nightly-encodes-${{ github.sha }}
          restore-keys: |
            ${{ steps.ledger-key.outputs.prefix }}
            ${{ steps.ledger-key.outputs.linux-key }}
            ${{ steps.ledger-key.outputs.linux-prefix }}
            nightly-encodes-
            ring1-spawn-parts-br-
      - run: pnpm build:game
      - run: node src/scripts/app-build/splitOutput.mjs dist --join
      - name: Exercise the production cold-pack and phone path
        env:
          NIGHTLY_GROUP: ${{ needs.plan.outputs.diagnostic_group }}
          DEBUG: pw:browser
        run: |
          if [ "$NIGHTLY_DRILL" = true ]; then
            node src/scripts/nightly-head-drill.ts "$NIGHTLY_BROWSER" "$NIGHTLY_GROUP" tmp/nightly/reports "$NIGHTLY_HEAD"
          else
            node src/scripts/nightly-heads.ts "$NIGHTLY_BROWSER" "$NIGHTLY_GROUP" tmp/nightly/reports "$NIGHTLY_HEAD"
          fi
      - name: Keep diagnostic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-head-diagnostic
          path: |
            tmp/nightly/reports/heads-*.json
            tmp/nightly/reports/**/heads-*.json
            tmp/nightly/reports/failures/**/*.json
            tmp/nightly/reports/**/failures/**/*.json
            tmp/nightly/reports/drill.json
          if-no-files-found: warn
          retention-days: 7

  # TC28 (J503, AD2): blocking. The quick proof also runs in ci-static on
  # every push; this job adds the real hosted cold, reuse and cold cooks.
  cook-cache:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cook_cache_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - name: Actual input closure, persistent hit, revision isolation and GC race
        run: node --import ./src/scripts/bake-loader.mjs --test src/scripts/cook-cache.proof.ts
      - name: Real cold, encoder reuse and independent cold cook
        run: node src/scripts/cook-cache-hosted.proof.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cook-cache
          path: tmp/cook-cache-report
          if-no-files-found: error
          retention-days: 7

  # TC39/J186: proof steps need their own green week, independent of the
  # live comparison (deployment/alignment is QA39/MW12). Review Nov23 earliest.
  # proof.xml decides the proof week; report.json is the live observation.
  # A report-only job's green does not imply a match.
  api-health:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.api_health_only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Observe exact lock resolution, HTTP mismatch and failure paths
        id: health-proof
        run: |
          mkdir -p tmp/api-health
          node --test --test-timeout=10000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=tmp/api-health/proof.xml src/scripts/api-health.proof.ts
      - name: Compare deployed validator with this engine lock
        if: ${{ !cancelled() }}
        run: node src/scripts/api-health.ts
      - name: Summarize the reader proof and live identity separately
        if: always()
        run: |
          echo '### API validator identity' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reader proof: ${{ steps.health-proof.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          if test -f tmp/api-health/report.json; then
            node --input-type=module <<'NODE'
          import {readFileSync, appendFileSync} from 'node:fs';
          const r = JSON.parse(readFileSync('tmp/api-health/report.json', 'utf8'));
          const state = r.ok ? 'MATCH' : r.complete ? 'MISMATCH' : 'UNAVAILABLE';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `\nLive identity: ${state}; engine ${r.expected}, API ${r.observed ?? 'missing'}.\n`);
          NODE
          else
            echo 'Live identity: no receipt was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-health
          path: tmp/api-health/
          if-no-files-found: error
          retention-days: 14
