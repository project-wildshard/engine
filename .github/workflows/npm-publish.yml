# NPM-PUBLISH (meta docs/plans/NPM-PUBLISH-PLAN.md; Jake 2026-11-12: "publish stuff to npm so it can be installed
# without git links"). The release train publishes @wildshard/engine to npm by trusted publishing (OIDC): no
# token is stored anywhere, and npm attaches the provenance itself. npm adds a trusted publisher only to a package
# that already exists, so the first version is published by hand (plan row NP4); until then this job skips with a
# notice. A manual run with placeholder=true publishes a README-only 0.0.x from this same file, so it proves the
# trusted publisher end to end without a release (NPM-PUBLISH smoke row).
# J475: staging_build publishes a SHA-versioned prerelease to next. The train dispatches publish_final after prod QA.
name: npm-publish
run-name: ${{ inputs.publish_final && format('npm latest {0}', inputs.publish_final) || inputs.staging_build && format('npm next {0}', inputs.staging_build) || 'npm-publish' }}

on:
  workflow_dispatch:
    inputs:
      placeholder:
        description: Publish a README-only placeholder of the package (no repo files)
        type: boolean
        default: false
      version:
        description: The placeholder version, always 0.0.x
        type: string
        default: 0.0.1
      staging_build:
        description: Full SHA of the release build to publish on npm next
        type: string
        default: ''
      staging_qualification:
        description: Exact-build qualification JSON or the J475 release CI receipt
        type: string
        default: ''
      publish_final:
        description: Published version tag already live on signed production
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'project-wildshard/engine' && github.ref == 'refs/heads/main' &&
      !inputs.placeholder &&
      ((inputs.publish_final == '' && inputs.staging_build != '' && inputs.staging_qualification != '') ||
       (inputs.publish_final != '' && inputs.staging_build == '' && inputs.staging_qualification == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_BUILD: ${{ inputs.staging_build }}
      RELEASE_TAG: ${{ inputs.publish_final }}
      NPM_CHANNEL: ${{ inputs.publish_final == '' && 'next' || 'latest' }}
    steps:
      - name: Validate the release request
        run: |
          if [[ "$NPM_CHANNEL" = next ]]; then
            [[ "$RELEASE_BUILD" =~ ^[a-f0-9]{40}$ ]]
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish_final != '' && format('refs/tags/{0}', inputs.publish_final) || inputs.staging_build }}
          # FR6: the release build's parent (its cut on main) re-proves a reused release CI below.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: ./.github/actions/org-deps
      - name: Install the pinned build dependencies
        run: pnpm install --frozen-lockfile --config.ci=false
      - name: Admit the exact staging release for npm next
        if: env.NPM_CHANNEL == 'next'
        env:
          GH_TOKEN: ${{ github.token }}
          E7_RELEASE_PUBLIC_KEY: ${{ vars.E7_RELEASE_PUBLIC_KEY }}
          STAGING_QUALIFICATION: ${{ inputs.staging_qualification }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_BUILD"
          branch="release/v$version"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)" = "$RELEASE_BUILD"
          attempt=()
          j475=$(jq -r 'has("j475")' <<< "$STAGING_QUALIFICATION")
          if [[ "$j475" = true ]]; then
            # The Actions success index can lag the exact completed run.
            run=$(jq -er '.j475.releaseCi | select(type == "number" and floor == . and . > 0)' <<< "$STAGING_QUALIFICATION")
          else
            # Older qualification receipts did not record a green run id.
            run=$(gh run list --workflow ci --branch "$branch" --commit "$RELEASE_BUILD" \
              --event push --limit 100 --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')
            if [[ -z "$run" ]]; then
              queue=$(jq -er '.ciJ381 | [.run, .attempt] | @tsv' <<< "$STAGING_QUALIFICATION")
              read -r run queue_attempt <<< "$queue"
              [[ "$queue_attempt" =~ ^[1-9][0-9]*$ ]]
              attempt=(--attempt "$queue_attempt")
            fi
          fi
          [[ "$run" =~ ^[1-9][0-9]*$ ]]
          # FAST-RELEASE FR6: a release-only build's ci reuses main's proof of its cut, so its code jobs skip. The same
          # selector re-proves that reuse here from git and the Actions API; anything unproven needs the full shape.
          reuse=$(GITHUB_OUTPUT='' GITHUB_REF="refs/heads/$branch" GITHUB_SHA="$RELEASE_BUILD" GITHUB_EVENT_NAME=push \
            node src/scripts/ci-selection.mjs | jq -r '.docs == true and (.reason | startswith("Release "))')
          export RELEASE_BRANCH="$branch" RELEASE_CI_RUN="$run" QUEUE_ATTEMPT="${queue_attempt:-}" RELEASE_REUSE="$reuse"
          gh run view "$run" "${attempt[@]}" --json databaseId,headSha,headBranch,event,workflowName,attempt,status,conclusion,jobs | node -e '
            const assert = require("node:assert/strict");
            const ci = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            assert.equal(ci.databaseId, Number(process.env.RELEASE_CI_RUN));
            assert.equal(ci.headSha, process.env.RELEASE_BUILD);
            assert.equal(ci.headBranch, process.env.RELEASE_BRANCH);
            assert.equal(ci.event, "push");
            assert.equal(ci.workflowName, "ci");
            assert.equal(ci.status, "completed");
            const reused = process.env.RELEASE_REUSE === "true" && process.env.QUEUE_ATTEMPT === "";
            const required = ci.jobs.filter(job => (job.name !== "nine-ledger-diagnostic" && !reused) || job.conclusion !== "skipped");
            assert.ok(reused ? required.filter(job => /^tests \(\d+\)$/u.test(job.name)).length >= 9 : required.length >= 12);
            if (reused) console.log("FR6: release CI reused the main proof of its cut; its code jobs skipped");
            const failed = required.filter(job => job.conclusion !== "success");
            assert.ok(failed.length < required.length);
            const queueAttempt = process.env.QUEUE_ATTEMPT;
            if (queueAttempt === "") {
              assert.equal(ci.conclusion, "success");
              assert.equal(failed.length, 0);
            } else {
              assert.equal(ci.attempt, Number(queueAttempt));
              assert.equal(ci.conclusion, "failure");
              assert.ok(JSON.parse(process.env.STAGING_QUALIFICATION).preAliasSmokeV1);
              const queueGuards = new Set(["memory-ledger-guard", "memory-footprint-guard"]);
              assert.ok(failed.length > 0 && failed.every(job => queueGuards.has(job.name) &&
                job.conclusion === "cancelled" && job.steps.length === 0), "J381 only covers a runner queue cancellation");
              console.log("J381 staging admission:", failed.map(job => job.name).join(", "), "cancelled before any steps");
            }
          '
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {readPublication} from './src/scripts/server-release/sign.mjs';

          const packageInfo = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(packageInfo.name, '@wildshard/engine');
          const proof = JSON.parse(process.env.STAGING_QUALIFICATION);
          assert.equal(proof.build, process.env.RELEASE_BUILD);
          if (proof.j475 !== undefined) {
            // J475 and J490: the exact green release CI above admits npm next independently of staging.
            assert.equal(process.env.QUEUE_ATTEMPT, '');
            assert.equal(proof.j475.releaseCi, Number(process.env.RELEASE_CI_RUN));
            console.log('Exact release CI admitted for npm next', packageInfo.version, proof.j475.releaseCi);
            process.exit(0);
          } else if (proof.preAliasSmokeV1 !== undefined) {
            const smoke = proof.preAliasSmokeV1;
            const scenarios = ['K1', 'K2', 'K3', 'K4', 'K5', 'K6'];
            const sha256 = /^[a-f0-9]{64}$/u;
            assert.equal(proof.stagingQualified, true);
            assert.equal(smoke.release, `v${packageInfo.version}`);
            assert.equal(smoke.build, proof.build);
            assert.equal(smoke.serial, proof.serial);
            assert.equal(smoke.hold, false);
            assert.deepEqual(smoke.ran, scenarios);
            assert.ok(smoke.findings.every(row => row.severity !== 'P0' && row.severity !== 'P1'));
            assert.ok(smoke.world.every(row => row.judged === true));
            assert.deepEqual([...new Set(smoke.world.map(row => row.scenario))].sort(), scenarios);
            assert.ok(smoke.world.some(row => row.scenario === 'K6' && typeof row.cell === 'string' && row.cell.length > 0));
            assert.deepEqual(smoke.journeys.map(row => row.browser).sort(), ['chromium', 'webkit']);
            assert.ok(smoke.journeys.every(row => row.pass === true && sha256.test(row.sha256)));
            assert.match(smoke.smokeSHA, sha256);
            assert.match(smoke.sourceAlias, /^[a-f0-9]{40}$/u);
            assert.notEqual(smoke.sourceAlias, smoke.build);
            assert.match(smoke.deploymentId, /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/u);
          } else if (proof.of8FocusedChromiumSweep !== undefined) {
            // The coordinator approved this path for 0.1.39 after the OF8 sweep.
            const sweep = proof.of8FocusedChromiumSweep;
            assert.equal(packageInfo.version, '0.1.39');
            assert.equal(sweep.build, proof.build);
            assert.equal(sweep.serial, proof.serial);
            assert.equal(sweep.browser, 'chromium');
            assert.equal(sweep.passed, 3);
            assert.equal(sweep.total, 3);
            assert.deepEqual(sweep.zones.map(row => row.slug).sort(), ['glowfen', 'mirror-salt', 'mossgate']);
            assert.ok(sweep.zones.every(row => Number.isFinite(row.enterMs) && row.enterMs > 0 && row.enterMs <= 60_000));
            assert.match(sweep.sha256, /^[a-f0-9]{64}$/u);
          } else {
            assert.equal(proof.stagingQualified, true);
            assert.deepEqual(proof.browsers.map(row => row.browser).sort(), ['chromium', 'webkit']);
            assert.ok(proof.browsers.every(row => row.pass === true &&
              row.zoneSweep.total > 0 && row.zoneSweep.opened === row.zoneSweep.total));
            assert.equal(proof.smoke.pass, true);
            assert.equal(proof.smoke.hold, false);
            assert.deepEqual(proof.smoke.ran, ['K1', 'K2', 'K3', 'K4', 'K5']);
          }
          const read = async url => {
            const response = await fetch(url, {cache: 'no-store', headers: {'user-agent': 'node WildshardAgent/1 (ci-npm-publish)'}, signal: AbortSignal.timeout(15_000)});
            assert.equal(response.status, 200);
            return response.text();
          };
          const [pageJson, signedJson] = await Promise.all([
            read('https://staging.wildshard.io/version.json'),
            read('https://packs.wildshard.io/releases/staging.json'),
          ]);
          const page = JSON.parse(pageJson);
          const release = readPublication(signedJson, process.env.E7_RELEASE_PUBLIC_KEY);
          assert.equal(release.channel, 'staging');
          assert.equal(release.engineBuild, process.env.RELEASE_BUILD);
          assert.equal(page.build, release.engineBuild);
          assert.equal(page.clientVersion, packageInfo.version);
          assert.equal(release.serial, proof.serial);
          console.log('Exact signed staging build admitted for npm next', page.clientVersion, release.serial);
          JS
          printf 'RELEASE_TAG=v%s\n' "$version" >> "$GITHUB_ENV"
      - name: Admit the exact production release for npm latest
        if: env.NPM_CHANNEL == 'latest'
        env:
          E7_RELEASE_PUBLIC_KEY: ${{ vars.E7_RELEASE_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {readPublication} from './src/scripts/server-release/sign.mjs';

          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const build = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          assert.equal(manifest.name, '@wildshard/engine');
          assert.equal(`v${manifest.version}`, process.env.RELEASE_TAG);
          const read = async url => {
            const response = await fetch(url, {cache: 'no-store', headers: {'user-agent': 'node WildshardAgent/1 (ci-npm-publish)'}, signal: AbortSignal.timeout(15_000)});
            assert.equal(response.status, 200);
            return response.text();
          };
          const [pageJson, signedJson] = await Promise.all([
            read('https://play.wildshard.io/version.json'),
            read('https://packs.wildshard.io/releases/production.json'),
          ]);
          const page = JSON.parse(pageJson);
          const release = readPublication(signedJson, process.env.E7_RELEASE_PUBLIC_KEY);
          assert.equal(release.channel, 'production');
          assert.equal(release.engineBuild, build);
          assert.equal(page.build, build);
          assert.equal(page.clientVersion, manifest.version);
          assert.equal(page.saveEpoch, release.saveEpoch);
          console.log('Signed production build admitted for npm latest', manifest.version, release.serial);
          JS
          printf 'RELEASE_BUILD=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use an npm that can publish by OIDC
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" ||
            npm install --global npm@11.16.0
          npm --version
      # SHARD-COMPAT LS1: the boot stamps are ignored build outputs, written from the pinned shards (npm-artifact refuses
      # an archive without them).
      - name: Write the boot stamps from the pinned shards
        run: |
          if ! node src/scripts/pins.ts install; then
            echo 'Pinned input install failed. Retrying once.' >&2
            node src/scripts/pins.ts install
          fi
          node src/scripts/gen.mjs --inputs-only
      - name: Build the versioned local author server
        run: node src/scripts/build-server.mjs --dev --out dist/dev-server
      - name: Check package version, bins and exports
        run: |
          args=("$RUNNER_TEMP/engine-npm")
          if [[ "$NPM_CHANNEL" = next ]]; then args+=("$RELEASE_BUILD"); fi
          node src/scripts/npm-artifact.mjs "${args[@]}" > "$RUNNER_TEMP/engine-npm.json"
          # shellcheck disable=SC2016 # the quoted script is JavaScript with template literals
          node -e '
          const { appendFileSync, readFileSync } = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const packed = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const pkg = JSON.parse(execFileSync("tar", ["-xOf", packed.filename, "package/package.json"], { encoding: "utf8" }));
          const version = process.argv[1].replace(/^v/, "");
          if (process.env.NPM_CHANNEL === "next") {
            const prefix = version + "-next.";
            const suffix = pkg.version.slice(prefix.length);
            if (!pkg.version.startsWith(prefix) || !/^[a-f0-9]{8,40}$/.test(suffix) ||
                !process.env.RELEASE_BUILD.startsWith(suffix) || pkg.gitHead !== process.env.RELEASE_BUILD)
              throw new Error("The next archive does not name the exact release build");
          } else if (pkg.version !== version) {
            throw new Error(`tag says ${version}, package.json says ${pkg.version}`);
          }
          if (pkg.private) throw new Error(`${pkg.name} is private`);
          const files = new Set(packed.files.map((file) => file.path));
          for (const name of ["main.mjs", "cellWorker.mjs", "rapier.wasm", "bundle.json", "migrations/0001-saves.sql"]) {
            if (!files.has(`dist/dev-server/${name}`)) throw new Error(`not in the tarball: dev server ${name}`);
          }
          if (!files.has("node_modules/@wildshard/format/package.json")) throw new Error("not in the tarball: frozen shard format");
          for (const patch of Object.values(pkg.pnpm?.patchedDependencies ?? {})) {
            if (!files.has(patch)) throw new Error(`not in the tarball: ${patch}`);
          }
          const targets = [];
          const walk = (value) => typeof value === "string" ? targets.push(value) : Object.values(value ?? {}).forEach(walk);
          walk(pkg.exports); walk(pkg.bin);
          const { posix } = require("node:path");
          for (const file of files) {
            if (!/(?:^|\/)tsconfig(?:\.[^/]+)?\.json$/.test(file)) continue;
            if (file.startsWith("node_modules/")) continue;
            const config = JSON.parse(execFileSync("tar", ["-xOf", packed.filename, "package/" + file], { encoding: "utf8" }));
            const parents = Array.isArray(config.extends) ? config.extends : [config.extends];
            const inputs = [...parents, ...(config.references ?? []).map(row => row.path)];
            for (const input of inputs) {
              if (typeof input !== "string" || !input.startsWith(".")) continue;
              const target = posix.normalize(posix.join(posix.dirname(file), input));
              const candidates = [target, target + ".json", posix.join(target, "tsconfig.json")];
              if (!candidates.some(candidate => files.has(candidate)))
                throw new Error("not in the tarball: compiler input " + target);
            }
          }
          const missing = [...new Set(targets)].filter((target) => !target.includes("*")).map((target) => target.replace(/^\.\//, "")).filter((target) => !files.has(target));
          if (missing.length > 0) throw new Error(`not in the tarball: ${missing.join(", ")}`);
          appendFileSync(process.env.GITHUB_ENV, `ENGINE_NPM_ARCHIVE=${packed.filename}\nNPM_VERSION=${pkg.version}\n`);
          console.log(`${pkg.name}@${pkg.version}: ${files.size} files, ${packed.size} bytes packed, every bin and export inside`);
          ' "$RELEASE_TAG" "$RUNNER_TEMP/engine-npm.json"
      # Every engine version carries a changelog (Jake, 2026-11-10); changelog-tag.yml checks the same, but a
      # separate workflow cannot stop this one.
      - name: Require the release changelog section at its commit
        run: node src/scripts/changelog.mjs check "$RELEASE_TAG" --at="$RELEASE_BUILD"
      - name: Publish the exact archive with its channel tag
        run: |
          name=$(node -p 'require("./package.json").name')
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "::notice::$name is not on npm yet. Its first version is published by hand (NPM-PUBLISH NP4)."
            exit 0
          fi
          if npm view "$name@$NPM_VERSION" version --prefer-online >/dev/null 2>&1; then
            if [[ "$NPM_CHANNEL" = latest && "$(npm view "$name@latest" version --prefer-online)" != "$NPM_VERSION" ]]; then
              echo "::error::$name@$NPM_VERSION already exists and latest is on another release."
              exit 1
            fi
            echo "::notice::$name@$NPM_VERSION is already on npm."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts --tag "$NPM_CHANNEL" "$ENGINE_NPM_ARCHIVE"

  placeholder:
    # Only main's copy of this file: the trusted publisher is bound to the file name, not the branch.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.placeholder &&
      inputs.staging_build == '' && inputs.staging_qualification == '' && inputs.publish_final == '' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: '@wildshard/engine'
            description: 'The Wildshard engine: game client and MMO server.'
    env:
      NAME: ${{ matrix.name }}
      DESCRIPTION: ${{ matrix.description }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Use an npm that can publish by OIDC
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" ||
            npm install --global npm@11.16.0
          npm --version
      - name: Write a package.json and README only
        run: |
          mkdir "$RUNNER_TEMP/placeholder"
          # shellcheck disable=SC2016 # the quoted script is JavaScript with template literals
          node -e '
          const fs = require("node:fs");
          const [dir, name, version, description, repo] = process.argv.slice(1);
          if (!/^0\.0\.[0-9]+$/.test(version)) throw new Error(`a placeholder version is 0.0.x, not ${version}`);
          const pkg = { name, version, description: `Placeholder. ${description}`, license: "UNLICENSED",
            repository: { type: "git", url: `git+https://github.com/${repo}.git` }, publishConfig: { access: "public" } };
          fs.writeFileSync(`${dir}/package.json`, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync(`${dir}/README.md`, [`# ${name}`, "", "Placeholder. The first real release publishes from CI.", "", description, "",
            `This ${version} was published by GitHub Actions with provenance from https://github.com/${repo}`,
            "(`npm-publish.yml`) to prove trusted publishing before a real release depends on it. Don\x27t install 0.0.x.", ""].join("\n"));
          ' "$RUNNER_TEMP/placeholder" "$NAME" "$VERSION" "$DESCRIPTION" "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/placeholder/package.json" "$RUNNER_TEMP/placeholder/README.md"
      - name: Publish the placeholder, unless it is already out
        working-directory: ${{ runner.temp }}/placeholder
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm."
            exit 0
          fi
          # A placeholder becomes latest (so the npm page shows its README) only while latest is a placeholder too.
          latest=$(npm view "$NAME" dist-tags.latest)
          tag=latest
          [[ "$latest" =~ ^0\.0\.[0-9]+$ ]] || tag=placeholder
          npm publish --provenance --access public --ignore-scripts --tag "$tag"
