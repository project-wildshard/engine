name: local-link

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.ci=false
      - run: pnpm exec npr install --frozen
      - name: Prove local admission, publication guards and exact shard comparison
        run: >-
          node src/scripts/vitest-tmp.ts run
          test/pin-local.test.ts test/local-candidate-guards.test.ts
          test/shard-check.test.ts --reporter=default --reporter=json
          --outputFile.json=tmp/local-link/proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # Same pin as engine ci
        if: always()
        with:
          name: local-link-proof
          path: tmp/local-link/proof.json
          if-no-files-found: error
