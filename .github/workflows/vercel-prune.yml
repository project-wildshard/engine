# Meta VERCEL-SPEND-PLAN (Jake, 2026-11-11: "storage pruner on all repos"). Agents publish play and staging by hand
# (scripts/staged-deployment.py, scripts/e7-page-routes.mjs) and the probe pages with the CLI, so no deploy workflow
# runs after them. Every deployment is a full copy billed as storage and Vercel's retention does not clear them: this
# sweep prunes those projects every hour. Live and aliased deployments always stay; a stage gets 24 hours, because a
# release stages hours before it promotes (v0.1.8 staged at 08:22 and promoted at 10:00).
name: vercel-prune

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: wildshard-e7, keep: 5}
          - {project: wildshard-e7-staging, keep: 3}
          - {project: wildshard-worker-proof, keep: 1}
          - {project: wildshard-worker-memory, keep: 1}
          - {project: wildshard-worker-timing, keep: 1}
          - {project: wire-install-probe, keep: 1}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/prune-deployments.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24}
      - name: Prune superseded deployments
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/prune-deployments.mjs --project ${{ matrix.project }} --keep ${{ matrix.keep }} --staged-grace-hours 24
