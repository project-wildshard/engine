# TC8: one actual head/browser for diagnosis; raw receipts never qualify a release.
name: nightly-head-diagnostic
on:
  workflow_dispatch:
    inputs:
      head:
        description: Committed pinned head to diagnose
        required: true
        type: string
      browser:
        description: Browser to diagnose
        type: choice
        options: [chromium, webkit]
        default: chromium
permissions:
  contents: read
concurrency:
  group: nightly-head-diagnostic-${{ github.ref }}-${{ inputs.head }}-${{ inputs.browser }}
  cancel-in-progress: false
jobs:
  head:
    runs-on: ${{ inputs.browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      NIGHTLY_HEAD: ${{ inputs.head }}
      NIGHTLY_BROWSER: ${{ inputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Refuse a head outside the committed nightly pins
        id: head
        run: |
          node --test scripts/nightly-head-group.proof.ts
          echo "group=$(node scripts/nightly-head-group.ts "$NIGHTLY_HEAD")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ring-setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/pins
          key: nightly-pins-${{ runner.os }}-${{ hashFiles('test/pins/shardfiles.json') }}
      - run: node scripts/pins.ts install
      - run: bash scripts/ci-playwright-install.sh "$NIGHTLY_BROWSER"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: nightly-encodes-${{ github.sha }}
          restore-keys: |
            nightly-encodes-
            ring1-spawn-parts-br-
      - run: pnpm build:game
      - run: node scripts/app-build/splitOutput.mjs dist --join
      - name: Exercise the production cold-pack and phone path
        env:
          NIGHTLY_GROUP: ${{ steps.head.outputs.group }}
        run: node scripts/nightly-heads.ts "$NIGHTLY_BROWSER" "$NIGHTLY_GROUP" tmp/nightly/reports "$NIGHTLY_HEAD"
      - name: Keep diagnostic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-head-diagnostic
          path: tmp/nightly/reports/heads-*.json
          if-no-files-found: warn
          retention-days: 7
