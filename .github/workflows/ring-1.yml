# Ring 1: what a push must pass. It tests products, not repos: pinned Template 1, Template 2 and Sunscar Dunes in full, and server
# slices of the other five. No shard repo is linked and no secret is read. A fork's pull request runs only once Jake approves it: that's
# the repo's Actions setting (J160), not this file.
# Meta repo docs/plans/TEST-COVERAGE-PLAN.md. Ring 2 is nightly.yml, scheduled directly on main.
name: ring-1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record:
        description: Record this platform's digest baseline and upload it, instead of comparing
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One run plus the newest pending on main (G609): cancelling there means no tip is ever sure to finish.
concurrency:
  group: ring-1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce quarantine admission dates and the 48-hour cap
        run: node scripts/test-quarantine.mjs --check-history
      - name: Report every inherited migration owner and fixed deadline
        run: node scripts/lift-pending.mjs
      - uses: ./.github/actions/ring-setup
      - run: bash scripts/ring1.sh static
      - run: pnpm test:kit

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - id: plan
        run: node scripts/engine-ci-plan.ts --ring=1
      - run: node test/vitest-sharding.test.ts --ring=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring1-test-plan
          path: tmp/engine-ci/plan.json
          retention-days: 7

  tests:
    needs: plan
    runs-on: ubuntu-latest
    # Keep the five-minute gate explicit and leave time to publish its failure.
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WILDSHARD_RING: '1'
      WS_TEST_QUARANTINE: blocking
      WS_CI_PLAN: tmp/engine-ci/plan.json
      WS_CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Start the fixed five-minute shard wall budget
        run: echo "WS_CI_SHARD_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ring1-test-plan
          path: tmp/engine-ci
      - run: node scripts/pins.ts install --ring 1
      - run: pnpm gen:inputs
      - name: Run the shard within its remaining five-minute budget
        run: node scripts/ci-shard-wall.mjs -- node scripts/engine-ci-shard.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring1-tests-${{ matrix.shard }}
          path: tmp/engine-ci
          retention-days: 7

      - name: Record the named shard wall-budget verdict
        if: always()
        run: node scripts/ci-shard-wall.mjs --check

  quarantine:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - run: pnpm pins
      - run: pnpm gen:inputs
      - run: node scripts/test-quarantine.mjs --shard=${{ matrix.shard }}/3
      - name: Keep the original quarantine results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ring1-quarantine-results-${{ matrix.shard }}
          path: tmp/quarantine
          retention-days: 7

  cook-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - run: bash scripts/ring1.sh cook-step
        env:
          RING_RECORD: ${{ inputs.record && 'true' || 'false' }}
      - name: Keep the recorded baseline
        if: ${{ inputs.record }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ring-digests
          path: test/pins/ring-digests.json
          retention-days: 7
      - name: Keep actual platform witnesses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ring-step-linux
          path: tmp/ring-cook/step.json
          retention-days: 7

  build-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/ring1.sh build-boot
