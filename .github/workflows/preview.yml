# SHELL-CUTOVER SC1 (meta docs/plans/multi-repo/SHELL-CUTOVER-PLAN.md; J172, J209, J210): preview.wildshard.io is the
# solo build of engine's newest green main. Once an hour the newest green main `ci` run's commit builds the game with no world stamp
# (the solo preview: no __WS_WORLD__, so the in-page server runs).
# OFF-VERCEL OV6 (meta docs/plans/OFF-VERCEL-PLAN.md; J272, J274): the page is the Cloudflare Worker wildshard-play-preview
# (pages/wrangler.jsonc --env preview), released by scripts/page-release.mjs in its four phases: build, upload (a
# version, never deployed), check (the version URL's bytes equal the local build), go-live (`wrangler versions deploy`,
# then preview.wildshard.io must serve this build). Workers dedupes assets by hash, so an hour uploads only changed files.
# An hour whose newest green main changed no client input since the live preview's commit releases nothing.
name: preview

on:
  # Hourly, not per push (J274: preview stays hourly at :17)
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: A main commit whose ci run is green (default the newest green main)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read # the newest green main ci run

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The build is about 20 minutes; a warm upload is minutes, a cold one (about 2 GB, OV6) must fit the 1-hour upload token
    timeout-minutes: 75
    steps:
      - name: The newest green main
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.sha }}
        run: |
          sha="$ASKED"
          [ -n "$sha" ] || sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          [ -n "$sha" ] || { echo "::error::no green main ci run"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "newest green main: $sha"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.pick.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Skip when the client is unchanged since the live preview
        id: changed
        run: |
          live=$(curl -fsS "https://preview.wildshard.io/version.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(String(JSON.parse(s).build).split('-')[0])}catch{console.log('')}})" || true)
          # every input of the client build: the game's code, its shards (the pins), the build tooling, the lockfile and the page host
          inputs=(src/client src/shared types vite vite.config.ts index.html public package.json pnpm-lock.yaml test/pins scripts/app-build scripts/build-app.mjs scripts/app-build-pipeline.mjs scripts/gen.mjs scripts/pins.ts pages scripts/page-release scripts/page-release.mjs)
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null && git diff --quiet "$live" HEAD -- "${inputs[@]}"; then
            echo "preview.wildshard.io already serves $live, and no client input changed since: no deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "live preview is '${live:-unknown}'; client inputs changed: deploy"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.deploy == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      # SENTRY-TRIAGE S5: the Workers host's package step sends the hidden maps to Sentry (release wildshard@<version>,
      # dist the build) with node scripts/sentry-maps.mjs dist --environment preview, then strips every map from dist/
      # (PZ1, OV4): a Sentry outage or a missing token never stops the preview, and no map reaches the CDN.
      # The Cloudflare token reaches wrangler only through the environment; page-release.mjs redacts it from all output.
      - name: Release preview.wildshard.io on Workers
        if: steps.changed.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/page-release.mjs preview build,upload,check,go-live --host=workers
