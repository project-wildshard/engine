# DF7 / J464 / J467: the nightly Driftwood floors table. The Mac mini measures main's tip at 02:17 Cancún
# (src/scripts/fps/nightly-mini.mjs, launchd) on its own Metal GPU and dispatches this job with the graded night. This job
# runs no measured code and holds no secret: it prints the night on the run's summary page and keeps night.json as the
# artifact the next night compares p95 against. Report only until DF15; DF15 sets GATE to 'true', and then a floor
# miss or a p95 more than 10% worse than the last green night fails the run, which main-watch reports as a fix row for
# the pushers since that night (J444: never a red main).
name: Driftwood FPS
run-name: driftwood fps ${{ inputs.build || 'no night' }} since ${{ inputs.since || 'none' }}
on:
  workflow_dispatch:
    inputs:
      build:
        description: The main commit the mini measured
        type: string
        required: false
        default: ''
      since:
        description: The build of the last green night (who pushed since then owns a regression)
        type: string
        required: false
        default: ''
      night:
        description: nightly.mjs --out, minified
        type: string
        required: false
        default: ''
      table:
        description: table.mjs's table.md
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: driftwood-fps
  cancel-in-progress: false
env:
  GATE: 'false'
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: inputs.night == ''
        run: echo 'DF7 nights come from the Mac mini (node src/scripts/fps/nightly-mini.mjs); dispatch with no night prints nothing.' >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.night != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            budgets
            src/scripts/budgets
            src/scripts/fps
      - if: inputs.night != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Print the night
        if: inputs.night != ''
        env:
          NIGHT: ${{ inputs.night }}
          TABLE: ${{ inputs.table }}
        run: |
          mkdir -p tmp/df7
          printf '%s\n' "$NIGHT" > tmp/df7/night.json
          printf '%s\n' "$TABLE" > tmp/df7/table.md
          gate=()
          if [ "$GATE" = true ]; then gate=(--gate); fi
          status=0
          node src/scripts/fps/nightly.mjs --receipt tmp/df7/night.json "${gate[@]}" || status=$?
          { echo; echo '<details><summary>The full table</summary>'; echo; cat tmp/df7/table.md; echo; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.night != ''
        with:
          name: driftwood-fps
          path: |
            tmp/df7/night.json
            tmp/df7/table.md
          if-no-files-found: warn
          retention-days: 30
