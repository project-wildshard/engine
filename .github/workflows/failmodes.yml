name: ring-2-failmodes

on:
  schedule:
    - cron: '37 7 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/failmodes.yml'
      - 'scripts/failmode-*.mjs'
      - 'scripts/online-rig*.mjs'
      - 'scripts/chaos-proxy*.mjs'
      - 'src/client/engine/boot/**'
      - 'src/client/engine/net/**'
      - 'src/client/engine/ui/buildCheck.ts'
      - 'src/client/engine/ui/downloadFailed.ts'
      - 'src/client/engine/ui/errorScreen.ts'
      - 'src/client/engine/ui/signInCard.ts'
      - 'src/client/engine/ui/Update.ts'
      - 'src/client/game/boot/**'
      - 'src/client/game/grid/*Shell.ts'
      - 'src/client/host/**/shell.ts'
      - 'src/client/host/online/**'
      - 'src/server/host/online/**'
      - 'src/shared/engine/net/**'
  workflow_dispatch:
    inputs:
      selection:
        description: Run all modes, the related-push sample, or a deliberately broken screen expectation
        type: choice
        options: [all, related, refusal]
        default: all

permissions:
  contents: read

concurrency:
  group: ring-2-failmodes-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    # All 55 cases keep real clocks and a minute's connect wait between play cases: about two and a half hours (FM11).
    timeout-minutes: ${{ github.event_name == 'push' && 15 || 200 }}
    env:
      WS_LANE_NAME: fm11
      SELECTION: ${{ github.event_name == 'push' && 'related' || inputs.selection || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - name: Install Chromium on the hosted runner
        run: pnpm exec playwright install chromium
      - run: pnpm exec vitest run test/tooling/failmode-deploy-fixture.test.mjs test/tooling/failmode-results.test.mjs test/failmode-cases.test.ts
      - name: Prepare one exact build
        run: |
          node scripts/scratch-dir.mjs fm11 'Ring 2 browser failure proof'
          flags=()
          if [ "$SELECTION" = all ]; then flags+=(--next); fi
          node scripts/failmode-proof.mjs --prepare tmp/fm11/build "${flags[@]}"
      - name: Judge the real failure screens
        run: |
          flags=(--engine=chromium --baseline)
          case "$SELECTION" in
            all)
              openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
                -keyout tmp/fm11/tls.key -out tmp/fm11/tls.crt
              flags+=(--scenario=all --seats=2 --next=tmp/fm11/build/next \
                --tls-key=tmp/fm11/tls.key --tls-cert=tmp/fm11/tls.crt)
              ;;
            related)
              # FM11's ten-minute push budget: two link cases (and drop's hold card), a shorter connect wait;
              # the nightly keeps the full minute and every case, release-429 among them.
              flags+=("--scenario=offline-play,drop" "--cooldown=20")
              ;;
            refusal)
              flags+=(--refusal=screen)
              ;;
            *)
              exit 2
              ;;
          esac
          # browser-lane kills its command after --max minutes (60 by default): the nightly's 55 cases need the job's time,
          # not 60 minutes, or the run dies at case 25 every night (QA 11-25 row 65)
          scripts/browser-lane.sh --max 190 node scripts/failmode-proof.mjs \
            tmp/fm11/build/dist tmp/fm11/run tmp/fm11/build/key.json pglite: "${flags[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failmodes-${{ github.sha }}
          path: |
            tmp/fm11/run/failmodes/receipt.json
            tmp/fm11/run/failmodes/shots/*.png
          if-no-files-found: error
          retention-days: 7
