name: ring-3
on:
  workflow_call:
    inputs:
      engine:
        description: Exact engine candidate commit
        required: true
        type: string
    secrets:
      NIGHTLY_APP_CLIENT_ID:
        required: false
      NIGHTLY_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      engine:
        description: Exact engine commit (empty uses this workflow ref)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ring-3-${{ inputs.engine || github.sha }}
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    # QA-FEEDBACK-2026-11-23-b row 40: the job pushes the packed candidate as ring3/<engine>, the commit the receivers install
    permissions:
      contents: write
    env:
      RING3_ENGINE: ${{ inputs.engine || github.sha }}
      RING3_ORIGIN_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.engine || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test src/scripts/ring3.proof.ts
      - run: node src/scripts/ring3.ts prepare
      # QA-FEEDBACK-2026-11-23-b row 40 (J505): a Git source archive lacks the ignored *.generated.* build outputs (Dunes and
      # Nalati failed on game/boot/audio.generated). Build the npm archive exactly as npm-publish.yml does, commit each file it
      # holds that Git does not track onto the candidate (ring3-pack.ts refuses if any *.generated.* is still missing), and send
      # that commit: the receivers install what npm ships.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: ./.github/actions/org-deps
      - name: Install the pinned build dependencies
        run: pnpm install --frozen-lockfile --config.ci=false
      - name: Build the npm archive, as npm-publish.yml does
        run: |
          if ! node src/scripts/pins.ts install; then
            echo 'Pinned input install failed. Retrying once.' >&2
            node src/scripts/pins.ts install
          fi
          node src/scripts/gen.mjs --inputs-only
          node src/scripts/build-server.mjs --dev --out dist/dev-server
          node src/scripts/npm-artifact.mjs "$RUNNER_TEMP/engine-npm" > tmp/ring3/npm.json
      - name: Send the packed candidate as ring3/<engine>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packed=$(node src/scripts/ring3-pack.ts "$RING3_ENGINE" tmp/ring3/npm.json)
          # the checkout's pre-push gate is for main; this ref only carries the archive's build outputs
          git push --force --no-verify --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${packed}:refs/heads/ring3/${RING3_ENGINE}"
          echo "RING3_PACKED=${packed}" >> "$GITHUB_ENV"
          echo "Ring 3 installs ${packed} (ring3/${RING3_ENGINE})"
          # keep two weeks of packed candidates
          cutoff=$(date -u -d '14 days ago' +%s)
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/ring3/" --jq '.[].ref' | while read -r ref; do
            when=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ref#refs/heads/}" --jq '.commit.committer.date' || echo '')
            if [ -n "$when" ] && [ "$(date -u -d "$when" +%s)" -lt "$cutoff" ]; then gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/${ref}" || true; fi
          done
      - name: Mint the dedicated nightly App token for the seven receivers
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: project-wildshard
          repositories: |
            shard-dunes
            shard-sky-reach
            shard-nalati
            shard-nine-dragon
            shard-driftwood
            shard-pine-hollow
            shard-open-plots
          permission-actions: write
          permission-issues: write
      - name: Dispatch exact candidates, wait, and file red-shard issues
        run: node src/scripts/ring3.ts run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Publish the release qualification aggregate
        if: always()
        run: |
          if [ -f tmp/ring3/summary.md ]; then
            cat tmp/ring3/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          node src/scripts/ring3.ts report
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ring-3-verdict
          path: |
            tmp/ring3/verdict.json
            tmp/ring3/summary.md
          if-no-files-found: error
          retention-days: 7
