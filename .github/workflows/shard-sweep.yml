name: shard-sweep

# Meta QA 11-25 row 61: every shard publish gets its tag and its engine pin
# with no hand step. A shard repo's GITHUB_TOKEN cannot push a tag onto a
# commit whose workflows differ from main's, and the nightly app's key that
# starts engine's pin lives only here (by design), so engine sweeps what
# each shard repo's published.json records: it tags a missing tag with the
# nightly app and starts shard-pin.yml for a revision engine has not pinned
# and no pin run has tried. scripts/shard-sweep.mjs; each step checks first.
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

env:
  WS_AGENT_UA: WildshardAgent/1 (ci-shard-sweep)

permissions:
  contents: read
  actions: write

concurrency:
  group: shard-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # Reads every shard repo and creates tag refs: contents and workflows
      # write (a tag on a commit whose workflows differ from main's needs it).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: write
          permission-workflows: write
      - name: Tag and pin what the shard repos published
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/shard-sweep.mjs
