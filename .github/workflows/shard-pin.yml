name: shard-pin

# Meta SHARD-PUBLISH-ACTIONS SP6 (J369, J371): after a shard repo's
# publish.yml commits a revision, pin it here on plan/pin-<slug>-r<N>,
# mirror its tarball on the `pins` release, and name the land steps in the
# run summary. A machine lands that branch through land.mjs's checks. No PR:
# pins reach main by land, never by pull request (Jake, 2026-11-19).
# Engine releases stay the MacBook's (J369); a pin bump is code.
#   gh workflow run shard-pin.yml -R project-wildshard/engine \
#     -f slug=<slug> -f revision=<N> -f hash=<sha256> -f channel=staging
on:
  workflow_dispatch:
    inputs:
      slug:
        description: The published slug
        type: string
        required: true
      revision:
        description: The catalogue revision publish printed
        type: string
        required: true
      hash:
        description: The revision's sha256
        type: string
        required: true
      channel:
        description: The channel publish moved
        type: choice
        options: [staging, prod]
        default: staging
  repository_dispatch:
    types: [shard-published]

env:
  WS_AGENT_UA: WildshardAgent/1 (ci-shard-pin)

permissions:
  contents: write

concurrency:
  group: shard-pin-${{ inputs.slug || github.event.client_payload.slug }}
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SLUG: ${{ inputs.slug || github.event.client_payload.slug }}
      REVISION: ${{ inputs.revision || github.event.client_payload.revision }}
      HASH: ${{ inputs.hash || github.event.client_payload.hash }}
      CHANNEL: ${{ inputs.channel || github.event.client_payload.channel || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Move the slug's pin and the staging snapshot
        run: node scripts/pin-shard.ts "$SLUG" "$REVISION" "$HASH" "$CHANNEL"
      # A Ring 1 slug's server slice is cut from its pinned head: a new head
      # needs a new slice in the same commit, or `pins.ts install --ring 1`
      # refuses it ("slice belongs to another head"; main red at dfb768cd0).
      - name: Find the moved pin in Ring 1
        id: ring1
        run: |
          if git diff --quiet -- test/pins/shardfiles.json; then exit 0; fi
          node -e '
            const ring = require("./test/pins/rings.json")["1"];
            const slice = ring.slices.includes(process.argv[1]);
            console.log("slice=" + slice);
            console.log("record=" + (slice || ring.products.includes(process.argv[1])));
          ' "$SLUG" >> "$GITHUB_OUTPUT"
      - if: steps.ring1.outputs.record == 'true'
        uses: ./.github/actions/ring-setup
      - name: Re-cut the Ring 1 server slices from the new pins
        if: steps.ring1.outputs.slice == 'true'
        run: node scripts/pins.ts slice
      - name: Record the moved shard's Ring 1 digest on the CI runner
        if: steps.ring1.outputs.record == 'true'
        run: |
          node scripts/pins.ts install --ring 1
          node --experimental-transform-types --no-warnings scripts/ring-step.ts --update --only "$SLUG"
      - name: Mirror the tarball on the pins release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view pins --json assets --jq '.assets[].name' | grep -qx "$HASH.tar"; then
            echo "pins already holds $HASH.tar"
          else
            curl -A "$WS_AGENT_UA" -fsSL -o "$RUNNER_TEMP/$HASH.tar" "https://api.wildshard.io/api/shardfiles/$HASH" --compressed
            echo "$HASH  $RUNNER_TEMP/$HASH.tar" | sha256sum -c -
            gh release upload pins "$RUNNER_TEMP/$HASH.tar"
          fi
      # A push by GITHUB_TOKEN starts no workflow, and land waits on the
      # branch's own ci run, so the push uses the nightly app's token.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.NIGHTLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: project-wildshard
          repositories: engine
          permission-contents: write
      - name: Commit on plan/pin-<slug>-r<N> and push
        id: branch
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="plan/pin-$SLUG-r$REVISION"
          git config user.name 'shard-pin'
          git config user.email 'shard-pin@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists already: nothing to push"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$branch"
          git commit -q -m "test(pins): pin $SLUG rev $REVISION" -m "Meta SHARD-PUBLISH-ACTIONS SP6: $SLUG rev $REVISION (${HASH:0:8}),
          published to $CHANNEL from Actions; shardfiles.json and the pinned
          document by pin-shard.ts, staging.json by refresh, Ring 1's slices by
          pins.ts slice and its CI digest by ring-step.ts, tarball on pins." \
            -m 'Assisted-by: shard-pin:workflow' -- test/pins/shardfiles.json test/pins/catalogue.json test/pins/staging.json test/pins/slices.json test/pins/ring-digests.json
          git push "https://x-access-token:${TOKEN}@github.com/project-wildshard/engine.git" "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Name the land steps
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          slug_dir="pin-$SLUG-r$REVISION"
          {
            echo "### $BRANCH"
            echo
            echo "Land it from either machine:"
            echo
            echo '~~~sh'
            echo 'cd ~/projects/games/wildshard/engine'
            echo "node scripts/worktree.mjs new $slug_dir"
            echo "cd .worktrees/$slug_dir && git fetch origin $BRANCH && git merge --ff-only FETCH_HEAD"
            echo 'pnpm pins   # gen:inputs refuses the old revision still in out/'
            echo 'WS_LANE_NAME=<lane> node scripts/land.mjs'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
