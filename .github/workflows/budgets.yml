name: budgets
# BC15: the run name carries the ci run it measured; main-watch reads that run's commit to name the pusher (a
# workflow_run's own head_sha is the default branch's tip when it starts).
run-name: budgets for ci ${{ inputs.source_run || github.event.workflow_run.id }}
# BUDGET-CAPS BC9 (meta docs/plans/BUDGET-CAPS-PLAN.md; J444, J445): the 10% regression check runs here, after ci, so ci's
# verdict and the release train's green-main read never wait on it. ci's own build steps refuse only past a hard cap
# (budgets/caps.json). This job measures the exact full pinned client ci's memory-client-build archived
# (memory-pinned-client): every zone's memory ledger (two totals a zone, median of three when a read is over), each
# shard's phone download, the app's code sizes, and phone Low triangles, draws and programs. It judges them with `node src/scripts/budgets/cli.mjs check`.
# A red run here is a fix row for whoever pushed the regression (main-watch names them), never a red main or a release
# hold. A new shard revision is new content and passes; record it with `node src/scripts/budgets/cli.mjs record --run <id>`.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: The ci run whose memory-pinned-client to measure
        type: string
        required: true
      seed:
        description: Extra budget measures (JSON, the cli.mjs measures shape) judged with the run's, to prove the job
        type: string
        required: false
        default: ''
      memory_record:
        description: Take three ledger reads a zone so the run's measures can be recorded
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: budgets-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false
jobs:
  budgets:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # Meta QA 11-25 row 55: the phone sweep alone took 34 min on eecbca881 (Nine r11); room for content to grow.
    timeout-minutes: ${{ inputs.memory_record && 120 || 90 }}
    env:
      WS_LANE_NAME: budgets
      SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
    steps:
      - name: Find the source run's pinned client
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?name=memory-pinned-client" --jq '[.artifacts[] | select(.expired == false)] | length')
          printf 'sha=%s\nartifact=%s\n' "$sha" "$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then echo "::notice::ci run $SOURCE_RUN archived no memory-pinned-client (no code change, or its build failed); nothing to measure"; fi
      - if: steps.source.outputs.artifact == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - if: steps.source.outputs.artifact == 'true'
        uses: ./.github/actions/ring-setup
      - if: steps.source.outputs.artifact == 'true'
        run: node src/scripts/.kit/scratch-dir.mjs budgets 'BUDGET-CAPS BC9 regression check'
      - if: steps.source.outputs.artifact == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: memory-pinned-client
          path: tmp/memory-ledger
      # A ci run of a commit from before BUDGET-CAPS (it finished after budgets.yml landed) has no budget tools: nothing
      # to judge, not a failure (44470269761 measured afa7d6dbe and failed on a missing cli.mjs).
      - name: Check the source commit has the budget tools
        id: tools
        if: steps.source.outputs.artifact == 'true'
        run: |
          if [[ -f src/scripts/budgets/cli.mjs ]]; then echo 'ok=true' >> "$GITHUB_OUTPUT"
          else echo "::notice::source commit predates BUDGET-CAPS (no src/scripts/budgets/cli.mjs); nothing judged"; echo 'ok=false' >> "$GITHUB_OUTPUT"; fi
      - name: Restore the pinned preview and install Chromium
        id: client
        if: steps.tools.outputs.ok == 'true'
        run: |
          tar -xf tmp/memory-ledger/client.tar
          rm tmp/memory-ledger/client.tar
          bash src/scripts/ci-playwright-install.sh chromium
      - name: Record the served ledger Brotli part digests
        if: steps.client.outcome == 'success'
        continue-on-error: true
        run: |
          export LC_ALL=C
          cd tmp/memory-ledger/preview/dist/assets/spawn
          manifest="$GITHUB_WORKSPACE/tmp/memory-ledger/spawn-parts.sha256"
          sha256sum -- parts/*.pack.br server/*.pack.br > "$manifest.tmp"
          mv -- "$manifest.tmp" "$manifest"
      - name: Measure phone Low frames for every pinned zone
        if: steps.client.outcome == 'success'
        env:
          FRAME_BUILD: ${{ steps.source.outputs.sha }}
        run: |
          if [[ ! -f src/scripts/budgets/phone-frames.mjs ]]; then
            echo "::notice::source commit predates the phone Low frame budgets"
            exit 0
          fi
          node src/scripts/budgets/phone-frames.mjs tmp/memory-ledger/preview tmp/budgets/phone-frames.json "$FRAME_BUILD"
      # The ledger step records its judged totals in tmp/budgets/ledger/budget-measures.json; the check below judges
      # them with the rest, so the step itself never decides the job.
      - name: Read every zone's memory ledger
        if: steps.client.outcome == 'success'
        continue-on-error: true
        env:
          MEMORY_RECORD: ${{ inputs.memory_record }}
        run: |
          record=()
          if [[ "$MEMORY_RECORD" == true ]]; then record+=(--record); fi
          node src/scripts/memory/ci.mjs ledger tmp/memory-ledger/preview tmp/budgets/ledger "${record[@]}"
      # BUDGET-CAPS BC11: Nine's boot budgets (retained geometry, live heap) are read by ci's nine-ring1 load, which fails
      # only on held parts or a missing reading; its budget-measures.json is judged here with the rest.
      - name: Fetch Nine's boot measures from the source run
        if: steps.client.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: nine-ring1-load
          path: tmp/budgets/nine
      - name: Collect the measured budgets
        if: steps.client.outcome == 'success'
        run: |
          node src/scripts/shard-size-gate.mjs tmp/memory-ledger/preview/dist --hard-only --measures tmp/budgets/downloads.json
          inputs=(tmp/budgets/downloads.json)
          if [[ -f src/scripts/budgets/phone-frames.mjs ]]; then inputs+=(tmp/budgets/phone-frames.json); fi
          nine=$(find tmp/budgets/nine -name budget-measures.json 2>/dev/null | head -1 || true)
          for file in tmp/memory-ledger/preview/dist/.vite/budget-measures.json tmp/budgets/ledger/budget-measures.json "$nine"; do
            if [[ -n "$file" && -f "$file" ]]; then inputs+=("$file"); fi
          done
          node src/scripts/budgets/cli.mjs merge tmp/budgets/measures.json "${inputs[@]}"
      - name: Check whether Nine boot needs confirmation
        id: nine-confirm
        if: steps.client.outcome == 'success'
        run: |
          needed=false
          if [[ $(jq -r '.caps["nine/boot/live-heap"].confirm // false' budgets/caps.json) == true ]]; then
            needed=$(node src/scripts/budgets/cli.mjs needs-confirmation tmp/budgets/measures.json)
          fi
          printf 'needed=%s\n' "$needed" >> "$GITHUB_OUTPUT"
      - name: Fetch the exact Nine client for confirmation
        id: nine-client
        if: steps.nine-confirm.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: nine-ring1-client
          path: tmp/nine-ring1
      - name: Confirm Nine boot on three fresh runs
        if: steps.nine-client.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p tmp/nine-ring1/preview
          tar -xf tmp/nine-ring1/client.tar -C tmp/nine-ring1/preview
          rm tmp/nine-ring1/client.tar
          reads=()
          for trial in 1 2 3; do
            node src/scripts/nine-ring1.mjs boot
            path="tmp/budgets/nine-confirm-$trial.json"
            cp tmp/nine-ring1/boot/budget-measures.json "$path"
            reads+=("$path")
          done
          node src/scripts/budgets/cli.mjs confirm tmp/budgets/measures.json "${reads[@]}"
      - name: Add the dispatched seed
        if: steps.client.outcome == 'success' && inputs.seed != ''
        env:
          SEED: ${{ inputs.seed }}
        run: |
          printf '%s\n' "$SEED" > tmp/budgets/seed.json
          node src/scripts/budgets/cli.mjs merge tmp/budgets/measures.json tmp/budgets/measures.json tmp/budgets/seed.json
      - name: Judge every budget (regressed or over a hard cap fails this job only)
        if: steps.client.outcome == 'success'
        run: node src/scripts/budgets/cli.mjs check tmp/budgets/measures.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: budgets
          path: |
            tmp/budgets/*.json
            tmp/budgets/ledger/*.json
            tmp/memory-ledger/spawn-parts.sha256
          retention-days: 14
          if-no-files-found: ignore
