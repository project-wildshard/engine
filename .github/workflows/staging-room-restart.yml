# Meta MINI-AUTONOMY MA7a (D7): restart the staging server (every staging room) without a box key on the Mac mini.
#   gh workflow run staging-room-restart.yml -R project-wildshard/engine -f channel=staging
# Staging only. `channel` exists so a production ask is refused on the record: the guard and
# `node src/scripts/box-ops.mjs restart` both refuse anything but staging before the job joins the tailnet or reads a key.
# The restart is `sudo -n systemctl restart wildshard-server@staging` from the agents' allowlist (MS3.5, J266) and must
# end `active`. MA7c: once a signed release puts the gate on the box, BOX_SSH_KEY becomes the workflows' own key, which the box forces to wildshard-box-gate (probe and
# restart-staging only), so even a changed workflow on main cannot restart production with it. Tailscale: see box-probe.yml.
name: staging-room-restart
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Must be staging; production is refused
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: box-ops
  cancel-in-progress: false
jobs:
  restart:
    if: github.repository == 'project-wildshard/engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: box
    env:
      CHANNEL: ${{ inputs.channel }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - name: Refuse anything but staging
        run: |
          if [ "$CHANNEL" != staging ]; then
            echo "::error::refused: only the staging server restarts from a workflow; '$CHANNEL' is read-only (MA7a)"
            echo "### staging-room-restart: refused '$CHANNEL' (production is read-only)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/scripts/box-ops.mjs
          sparse-checkout-cone-mode: false
      - name: Stop before the box without a tailnet client (OPEN QUESTION)
        if: env.TS_OAUTH_CLIENT_ID == ''
        run: |
          echo "::error::OPEN QUESTION: no Tailscale OAuth client in environment box (TS_OAUTH_CLIENT_ID); the box is tailnet-only"
          exit 1
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Write the agents' ssh alias from secrets
        env:
          BOX_SSH_KEY: ${{ secrets.BOX_SSH_KEY }}
          BOX_SSH_HOST: ${{ secrets.BOX_SSH_HOST }}
          BOX_KNOWN_HOSTS: ${{ secrets.BOX_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$BOX_SSH_KEY" > ~/.ssh/wildshard-agent; printf '%s\n' "$BOX_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          printf 'Host wildshard-agent\n  HostName %s\n  User wildshard-agent\n  IdentityFile ~/.ssh/wildshard-agent\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$BOX_SSH_HOST" > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Restart the staging server and wait for active
        shell: bash
        run: |
          node src/scripts/box-ops.mjs restart "$CHANNEL" | tee "$RUNNER_TEMP/restart.json"
          { echo "### staging-room-restart"; echo '```json'; cat "$RUNNER_TEMP/restart.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/wildshard-agent ~/.ssh/config
