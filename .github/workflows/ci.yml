name: ci

# CI-JOB-PACKING (J244, Jake 2026-11-10): one workflow for a push. It was ci (21 jobs), ring-1 (16) and
# engine-boundaries (1): 38 jobs, a third of their runner time the same work twice, on an org that runs 20 at
# once. Now every unit of work runs once, packed longest-first into the `tests` matrix by scripts/ci-pack.mjs:
# ci's static checks, the planner's proofs, e2e, every planned test shard, Ring 1's products (cook, build, boot)
# and the engine-boundaries cook-to-play report. Quarantine keeps its own non-blocking job (J193).
# EV3 (HOW-WE-BUILD, 2026-11-12): products and boundaries take the last share, `tests (6)`, to themselves, beside the
# shards (after that job's own set-up and pins); jobs 1-5 pack everything else. Run after job 1's shards, products
# made job 1 the long pole.
on:
  # J240: a plan worktree pushes plan/<slug>; scripts/land.mjs waits for this
  # exact SHA to go green here, then fast-forwards main to it. Main's run of
  # that same SHA reuses the branch run (scripts/ci-exact-reuse.mjs).
  push:
    branches: [main, 'plan/**']
  pull_request:
  workflow_dispatch:
    inputs:
      record:
        description: Record Ring 1's platform digest baseline and upload it, instead of comparing
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Qualification dispatches must execute, rather than replacing a pending
  # publication run. Ordinary push/PR ordering retains its existing group.
  # Main pushes get one group per SHA: GitHub keeps one pending run per group and cancels the older pending one even
  # with cancel-in-progress false, so lands a minute apart cancelled each other's main runs and main never confirmed
  # anything (J249 needs main's own run). Main runs are mostly the cheap exact-reuse check, so running each costs little.
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-qualification-{0}', github.run_id) || '' }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  # A newer push to the same plan branch supersedes its older SHA; main never cancels.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/plan/') }}

jobs:
  # Every job gates itself, so no job waits on another before it can start: a main push of a SHA its plan
  # branch already proved green reuses that run (J240), and a docs-only push runs only job 1's docs checks.
  # A job that runs its packed share says so in its step "Run this job's packed share"; scripts/ci-proof-jobs.mjs
  # counts a run as a code proof only when every share ran that step green.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The plan-branch run a main push reused (J240): its reports are this SHA's measurements (LS2's timings job).
    outputs:
      reused-run: ${{ steps.reuse.outputs.run }}
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    env:
      WS_TEST_QUARANTINE: blocking
      WS_CI_PLAN: tmp/engine-ci/plan.json
      # Ring 1's build here is a test build, never shipped (release.sh builds its own): a paused or failing production
      # (a paused host answers 503) warns instead of failing it. A release build still refuses.
      WS_PREVIOUS_DEPLOY_OPTIONAL: '1'
    steps:
      - name: Start the job clock (each shard's five-minute budget includes this job's set-up, J193)
        run: echo "WS_CI_SHARD_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Reuse this exact SHA's green plan-branch run (J240)
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-exact-reuse.mjs ci.yml
      - name: Enforce quarantine admission dates and the 48-hour cap
        if: matrix.job == 1
        run: node scripts/test-quarantine.mjs --check-history
      - name: Report every inherited migration owner and fixed deadline
        if: matrix.job == 1
        run: node scripts/lift-pending.mjs
      - name: Scan the complete incoming history
        if: matrix.job == 1
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
        # A plan branch is new or rebased, so its `before` is zero or off-history: scan from main.
        run: |
          base="$BASE_SHA"
          case "$GITHUB_REF" in refs/heads/plan/*) base="$(git merge-base origin/main "$GITHUB_SHA")" ;; esac
          printf 'refs/heads/main %s refs/heads/main %s\n' "$GITHUB_SHA" "$base" | node .githooks/check-push.mjs
      - name: Require this version's changelog section (Jake, 2026-11-10)
        if: matrix.job == 1
        run: node scripts/changelog.mjs check --at="$GITHUB_SHA"
      - name: Classify from an actually green code-proving ancestor
        if: steps.reuse.outputs.reused != 'true'
        id: paths
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs
      # A docs-only push still runs lint, format and the committed asks, once.
      - if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs == 'true' && matrix.job == 1
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs == 'true' && matrix.job == 1
        run: bash scripts/ci-static.sh docs
      - id: code
        if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs != 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      # BROWSER-TESTS-BENCH BB2/BB5 (J231): e2e's headless shell and products' Chromium, cached by Playwright version.
      - id: playwright
        if: steps.code.outputs.run == 'true'
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-pack-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Spawn parts' q11 Brotli bodies, kept by content (DL15); each one is checked against its body before use.
      - if: steps.code.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ring1-spawn-parts-br-${{ github.sha }}
          restore-keys: ring1-spawn-parts-br-
      # Every share plans the same suite: same tree, and quarantine and lift-pending judged at the run's own start,
      # not at whenever each job got a runner, so no file can fall between two shares' plans.
      - name: Judge exclusions at the run's start
        if: steps.code.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "WS_CI_EXCLUSION_AT=$(node -e "console.log(Date.parse(process.argv[1]))" "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)")" >> "$GITHUB_ENV"
      # LAND-SIMPLIFY LS2 (J250, J258): the planner's weights are main's last measured run, never a committed file.
      # Every share must plan from the same table, or shares pack different shards and skip files while green: the
      # newest main `timings-*` entry made before this run started, restored by its exact key. With none, the newest
      # earlier green run's artifacts; else defaults. An API failure fails the share, never a split plan.
      - name: Pick main's last measured test timings made before this run
        id: timings
        if: steps.code.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-timings.mjs pick --before="$WS_CI_EXCLUSION_AT"
      - if: steps.code.outputs.run == 'true' && steps.timings.outputs.key != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/timings
          key: ${{ steps.timings.outputs.key }}
          fail-on-cache-miss: true
      - name: With no cache, rebuild the timings from the newest earlier green run
        if: steps.code.outputs.run == 'true' && steps.timings.outputs.key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-timings.mjs fetch --strict --before="$WS_CI_EXCLUSION_AT"
      - name: Plan the smallest useful shards from actual discovery
        if: steps.code.outputs.run == 'true'
        run: node scripts/engine-ci-plan.ts
      # The packed static unit shellchecks the agent hook scripts at this exact version
      # (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      - name: Install shellcheck 0.11.0
        if: steps.code.outputs.run == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Run this job's packed share
        id: pack
        if: steps.code.outputs.run == 'true'
        env:
          RING_RECORD: ${{ inputs.record && 'true' || 'false' }}
        run: node scripts/ci-pack.mjs --jobs=${{ strategy.job-total }} --job=${{ matrix.job }} --concurrency=2 --units=static,e2e,plan-proofs,tests,products,boundaries
      - name: Retain actual membership, budget and timing evidence
        if: always() && steps.code.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-ci-${{ matrix.job }}
          path: |
            tmp/engine-ci
            tmp/ci-pack/*.json
            tmp/ring-cook/step.json
            tmp/engine-boundaries
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the recorded Ring 1 baseline
        if: inputs.record && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ring-digests
          path: test/pins/ring-digests.json
          retention-days: 7
      - name: Keep only this build's spawn-part encodings in the cache
        if: steps.pack.outputs.products == 'true'
        run: |
          cache=~/.cache/wildshard/gen/spawn-parts-br/1
          shopt -s nullglob
          for file in "$cache"/*.br; do
            name=$(basename "$file")
            [ -f "dist/assets/spawn/parts/${name:0:16}.pack.br" ] || rm -f "$file"
          done
          du -sh "$cache" 2>/dev/null || true
      - if: steps.pack.outputs.products == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ring1-spawn-parts-br-${{ github.sha }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ matrix.job }}
          path: src/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Record every shard's wall-budget verdict, artifact upload included (J193)
        if: always() && steps.code.outputs.run == 'true'
        run: node scripts/ci-pack.mjs --check-walls --job=${{ matrix.job }}
      # One run stands for every commit since the last finished run (was the verdict-coverage job; each share now
      # names the range and flags its own red, so a main push needs no extra job).
      - name: Name the commits this verdict covers
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          REUSED: ${{ steps.reuse.outputs.reused }}
          DOCS_ONLY: ${{ steps.paths.outputs.docs }}
          CODE_BASE: ${{ steps.paths.outputs.code_base }}
        run: |
          if test "$REUSED" = true; then echo "### Reused this SHA's green plan-branch run (J240)." >> "$GITHUB_STEP_SUMMARY"; fi
          if test "$DOCS_ONLY" = true; then
            echo "### Tests skipped (docs-only); code unchanged since proved $CODE_BASE." >> "$GITHUB_STEP_SUMMARY"
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[]|select(.status == \"completed\" and .conclusion != \"cancelled\" and .id != $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished run to compare against'; exit 0; }
          commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq '.commits[]|"\(.sha[0:10]) \(.commit.message|split("\n")[0])"')
          range="${previous:0:10}..${GITHUB_SHA:0:10}"
          { echo "### Commits since the last finished run: $range"; echo '```'; echo "$commits"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if test "$RESULT" = failure; then
            echo "::error title=Red run covers $range::$(printf '%s\n' "$commits" | sed '/^$/d' | wc -l | tr -d ' ') commits after the last finished run; see this job's summary"
          fi

  timings:
    # LAND-SIMPLIFY LS2 (J250, J258): main's run measures every planned file; merge its shard reports into the
    # table and save it as the newest `timings-<run id>`, which every later run's planner restores. It never fails
    # the run: a missed save only leaves the previous table in place. Node built-ins only, no install.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/timings
          key: timings-${{ github.run_id }}
          restore-keys: timings-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: engine-ci-*
          path: tmp/timings-run
      - name: A main push that reused its plan-branch run takes that run's reports
        if: needs.tests.outputs.reused-run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.tests.outputs.reused-run }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'engine-ci-*' -D tmp/timings-run
      - name: Merge this run's measured files into the table
        id: collect
        run: node scripts/test-timings.mjs collect tmp/timings-run
      - if: steps.collect.outputs.measured == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/timings
          key: timings-${{ github.run_id }}

  quarantine:
    # J193: run every active quarantined proof with its ordinary exit code,
    # separately from the blocking verdict and its covered-commit summary.
    # One job, one file at a time (it was three in ci, and ring-1 ran the same three again).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Reuse this exact SHA's green plan-branch run (J240)
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-exact-reuse.mjs ci.yml
      - name: Classify from an actually green code-proving ancestor
        if: steps.reuse.outputs.reused != 'true'
        id: paths
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs
      - id: code
        if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs != 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - if: steps.code.outputs.run == 'true'
        run: pnpm pins && pnpm gen:inputs
      - if: steps.code.outputs.run == 'true'
        run: node scripts/test-quarantine.mjs --shard=1/1
      - name: Keep the original quarantine results
        if: always() && steps.code.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-quarantine-results
          path: tmp/quarantine
          retention-days: 7
