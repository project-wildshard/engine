name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Qualification dispatches must execute, rather than replacing a pending
  # publication run. Ordinary push/PR ordering retains its existing group.
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-qualification-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      code_base: ${{ steps.paths.outputs.code_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Enforce quarantine admission dates and the 48-hour cap
        run: node scripts/test-quarantine.mjs --check-history
      - name: Report every inherited migration owner and fixed deadline
        run: node scripts/lift-pending.mjs
      - name: Scan the complete incoming history
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
        run: printf 'refs/heads/main %s refs/heads/main %s\n' "$GITHUB_SHA" "$BASE_SHA" | node .githooks/check-push.mjs
      - name: Require this version's changelog section (Jake, 2026-11-10)
        run: node scripts/changelog.mjs check --at="$GITHUB_SHA"
      - name: Classify from an actually green code-proving ancestor
        id: paths
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs

  static:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - if: needs.changes.outputs.docs != 'true'
        run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Prove exact compressed model admission and scope lifetime
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/bake-loader.mjs --experimental-transform-types --test test/ci/entry-model-values.proof.mjs
      - name: Prove grid-owned quest dialogue lifetime
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/bake-loader.mjs --experimental-transform-types --test test/ci/quest-home-lifetime.proof.mjs
      - name: Prove hover boost through real player and server motors
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/bake-loader.mjs --experimental-transform-types --test test/ci/hover-boost.proof.mjs
      - name: Prove earned coin and barter transactions
        if: needs.changes.outputs.docs != 'true'
        run: |
          node scripts/pins.ts install driftwood-isle pine-hollow
          node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/net-exchange.proof.mjs
      - name: Prove earned loadout and author publication contracts
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/native-loadout.proof.mjs
      - name: Prove keyed sky clock and data admission contracts
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/keyed-sky-clock.proof.mjs
      - name: Prove actual quest progress and native placement floors
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/interaction-placement.proof.mjs
      - name: Prove shipped weather continuation and native storm decisions
        if: needs.changes.outputs.docs != 'true'
        run: |
          node scripts/pins.ts install pine-hollow nalati-grasslands
          node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/weather-legacy.proof.mjs test/ci/weather-continuation.proof.mjs
      - name: Prove actual admitted entry render fences and refusal drain
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/bake-loader.mjs --experimental-transform-types --test test/ci/hybrid-render-preparation.proof.mjs
      - name: Prove actual climate acts and page rows through local rooms
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/bake-loader.mjs --experimental-transform-types --test test/ci/net-climate.proof.mjs
      - name: Prove independent native quest seats and saved cable rides
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/quest-seats.proof.mjs
      - name: Prove actual native item frame continuation and reaction order
        if: needs.changes.outputs.docs != 'true'
        run: node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test test/ci/native-item-frame.proof.mjs
      - name: Prove declared input and persisted cosmetic migration
        if: needs.changes.outputs.docs != 'true'
        run: |
          node scripts/pins.ts install nine-dragon-stack
          node --import ./scripts/bake-loader.mjs --experimental-transform-types --test test/ci/declared-input.proof.mjs
      - name: Validate committed asks even on documentation pushes
        run: node src/scripts/asks.mjs check --all
      - if: needs.changes.outputs.docs != 'true'
        run: pnpm check:sides && pnpm check:asks && pnpm check:page-events && pnpm test:kit && pnpm test:hooks

  plan:
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - name: Plan the smallest useful matrix from actual discovery
        id: plan
        run: node scripts/engine-ci-plan.ts
      - name: Prove actual phase discovery and hostile-plan refusal
        run: node scripts/engine-ci-membership-proof.ts
      - name: Prove actual planned dispatch and unplanned-file refusal
        run: node scripts/engine-order-proof.mjs
      - name: Prove cached public imports follow a package retag
        run: node scripts/module-cache-proof.mjs
      - name: Calibrate real CPU observations and report surviving writers
        run: python3 scripts/cpu-census-proof.py
      - name: Prove an actual over-budget file refuses
        run: node scripts/engine-ci-proof.mjs && node scripts/engine-ci-proof.mjs tmp/engine-ci-budget-proof --import
      - name: Prove a named shard deadline drains descendants
        run: node scripts/ci-shard-wall-proof.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-ci-plan
          path: tmp/engine-ci/plan.json
          retention-days: 7

  tests:
    needs: plan
    runs-on: ubuntu-latest
    # The explicit wall gate still fails at five minutes; reserve diagnostic time.
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WS_TEST_QUARANTINE: blocking
      WS_CI_PLAN: tmp/engine-ci/plan.json
      WS_CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Start the fixed five-minute shard wall budget
        run: echo "WS_CI_SHARD_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: engine-ci-plan
          path: tmp/engine-ci
      - run: pnpm pins && pnpm gen:inputs
      - name: Run the shard within its remaining five-minute budget
        run: node scripts/ci-shard-wall.mjs -- node scripts/engine-ci-shard.mjs
      - name: Retain actual membership, budget and timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-ci-${{ matrix.shard }}
          path: tmp/engine-ci
          retention-days: 7

      - name: Record the named shard wall-budget verdict
        if: always()
        run: node scripts/ci-shard-wall.mjs --check

  e2e:
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Org git dependencies are public (J160, J163). pnpm-lock.yaml can record
      # them as git@github.com:..., so every URL form goes to plain HTTPS.
      - name: Read org repos over HTTPS
        run: |
          base="https://github.com/project-wildshard/"
          git config --global url."$base".insteadOf "git@github.com:project-wildshard/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/project-wildshard/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Jake 2026-11-10: the title's hero stays big and its build label short and clear of the logo
      - run: node --test test/title-layout-browser.proof.mjs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: src/e2e/test-results/
          retention-days: 7

  quarantine:
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    # J193: run every active quarantined proof with its ordinary exit code,
    # separately from the blocking verdict and its covered-commit summary.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - run: pnpm pins
      - run: pnpm gen:inputs
      - run: node scripts/test-quarantine.mjs --shard=${{ matrix.shard }}/3
      - name: Keep the original quarantine results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-quarantine-results-${{ matrix.shard }}
          path: tmp/quarantine
          retention-days: 7

  verdict-coverage:
    needs: [changes, static, plan, tests, e2e]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      # One run stands for every commit since the last finished run.
      - name: Name the commits this verdict covers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs }}
          CODE_BASE: ${{ needs.changes.outputs.code_base }}
        run: |
          if test "$DOCS_ONLY" = true; then
            echo "### Tests skipped (docs-only); code unchanged since proved $CODE_BASE." >> "$GITHUB_STEP_SUMMARY"
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[]|select(.status == \"completed\" and .conclusion != \"cancelled\" and .id != $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished run to compare against'; exit 0; }
          commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq '.commits[]|"\(.sha[0:10]) \(.commit.message|split("\n")[0])"')
          range="${previous:0:10}..${GITHUB_SHA:0:10}"
          { echo "### Commits since the last finished run: $range"; echo '```'; echo "$commits"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in
            *' failure '*) echo "::error title=Red run covers $range::$(printf '%s\n' "$commits" | sed '/^$/d' | wc -l | tr -d ' ') commits after the last finished run; see this job's summary" ;;
          esac
