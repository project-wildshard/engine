name: ci

# J400: eight packed test runners plus share nine's products and T1 batch.
# Boundaries starts independently. Report-only soaks, quarantine and timings
# are source-run follow-ups in ci-reports.yml and cannot hold this verdict.
on:
  # Local-gate land pushes only main. plan/** remains for --hosted fallback;
  # its exact main SHA may reuse that green branch run (J240).
  push:
    branches: [main, 'plan/**', 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      pins_channel:
        description: Reviewed pin snapshot to test (staging release hash awaits AP-26)
        type: choice
        options: [production, staging]
        default: production
      memory_record:
        description: Measure candidate memory ratchet baselines
        type: boolean
        required: false
        default: false
      memory_record_zones:
        description: Optional comma-separated Ubuntu recording zones including _template
        type: string
        required: false
        default: ''
      record:
        description: Record Ring 1's platform digest baseline and upload it, instead of comparing
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

env:
  WILDSHARD_PIN_CHANNEL: ${{ inputs.pins_channel || 'production' }}

concurrency:
  # Qualification dispatches must execute, rather than replacing a pending
  # publication run. Ordinary push/PR ordering retains its existing group.
  # CIQ1 (meta HOW-WE-BUILD, J222's burst coalescing): main pushes share one group. GitHub keeps the running run and
  # only the newest pending one, so a burst of N main pushes costs at most two full runs, not N; the newest covers
  # every commit before it (the descendant-green rule: scripts/main-watch.mjs reads a cancel as superseded, never red,
  # and main-watch reads actual commit ancestry, independently of reports). One group per SHA ran 131 of 2026-11-13's 135 main pushes
  # in full (a land rebases, so exact reuse rarely fires): 39 % of the org's runner time in the 15:00-18:00 Cancun
  # burst, when lands queued 15-25 min behind the 20-job cap. Releases run on their own release/vX.Y.Z ref
  # (RELEASE-BRANCHES RB1); their CI is independent of main and is never cancelled.
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-qualification-{0}', github.run_id) || '' }}
  # A newer push to the same plan branch supersedes its older SHA; main and release refs never cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/plan/') }}

jobs:
  # Every packed job gates itself, so its shares start independently: a main push of a SHA its plan
  # branch already proved green reuses that run (J240), and a docs-only push runs only job 1's docs checks.
  # A job that runs its packed share says so in its step "Run this job's packed share"; scripts/ci-proof-jobs.mjs
  # counts a run as a code proof only when every share ran that step green. T1 consumes its producer's build in that same job.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The plan-branch run a main push reused (J240): its reports are this SHA's measurements (LS2's timings job).
    outputs: &packed-outputs
      reused-run: ${{ steps.reuse.outputs.run }}
      code-run: ${{ steps.code.outputs.run }}
      t1-blocking: ${{ steps.t1-policy.outputs.blocking }}
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    env: &packed-env
      WS_TEST_QUARANTINE: blocking
      WS_CI_PLAN: tmp/engine-ci/plan.json
      # Ring 1's build here is a test build, never shipped (release.sh builds its own): a paused or failing production
      # (a paused host answers 503) warns instead of failing it. A release build still refuses.
      WS_PREVIOUS_DEPLOY_OPTIONAL: '1'
    steps: &packed-steps
      - name: Start the job clock (each shard's five-minute budget includes the set-up every job shares, J193)
        run: echo "WS_CI_SHARD_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      # Keep ancestry and incoming-history checks, but fetch historical blobs
      # on demand. Run 44137015477 spent 460 s fetching every branch/tag's
      # file bodies before any test, exhausting each shard's shared setup.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Reuse this exact SHA's green plan-branch run (J240)
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-exact-reuse.mjs ci.yml
      # EV3c: the checks below run only in job 1 (the history scan alone is ~100 s), so its shards are not charged them;
      # ci-pack.mjs takes WS_CI_JOB_OWN_MS off the job clock. They took tests (1)'s shards to 300 s on 132-142 s of tests.
      - name: Start job 1's own-checks clock (not charged to its shards)
        if: matrix.job == 1
        run: echo "WS_CI_JOB_OWN_FROM_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Enforce quarantine admission dates and the 48-hour cap
        if: matrix.job == 1
        run: node scripts/test-quarantine.mjs --check-history
      - name: Scan the complete incoming history
        if: matrix.job == 1
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
          GH_TOKEN: ${{ github.token }}
        # Plan pushes can be new or rebased. New release branches also have
        # a zero before SHA. Their commits inherited from main were scanned
        # there, so only the commits outside main need scanning here.
        run: |
          base="$BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main && "$base" =~ ^0+$ ]]; then
            # A main dispatch has no before SHA. Reuse only a proved ancestor whose scan passed.
            proved="$(node scripts/ci-selection.mjs --history-base)"
            if [[ -n "$proved" ]]; then base="$proved"; fi
          fi
          case "$GITHUB_REF:$base" in
            refs/heads/plan/*|refs/heads/release/*:0000000000000000000000000000000000000000)
              base="$(git merge-base origin/main "$GITHUB_SHA")" ;;
          esac
          printf 'refs/heads/main %s refs/heads/main %s\n' "$GITHUB_SHA" "$base" | node .githooks/check-push.mjs
      - name: Require this version's changelog section (Jake, 2026-11-10)
        if: matrix.job == 1
        run: node scripts/changelog.mjs check --at="$GITHUB_SHA"
      # SHARD-DELETE DEL9: the pins and both release variables name only slugs the live catalogue lists (a deleted shard
      # leaves it). Offline half: test/pins-catalogue.test.ts. An API outage warns, never reds.
      - name: Refuse a pinned or released slug the API catalogue no longer lists
        if: matrix.job == 1
        env:
          E7_STAGING_SHARDS: ${{ vars.E7_STAGING_SHARDS }}
          E7_PRODUCTION_SHARDS: ${{ vars.E7_PRODUCTION_SHARDS }}
        run: node scripts/pins-catalogue.ts check
      - name: Stop job 1's own-checks clock
        if: matrix.job == 1
        run: echo "WS_CI_JOB_OWN_MS=$(( $(date +%s%3N) - WS_CI_JOB_OWN_FROM_MS ))" >> "$GITHUB_ENV"
      - name: Classify from an actually green code-proving ancestor
        if: steps.reuse.outputs.reused != 'true'
        id: paths
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs
      # A docs-only push still runs lint, format, the committed asks, agent parity and any test that reads a changed
      # doc (EV9), once.
      - if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs == 'true' && matrix.job == 1
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs == 'true' && matrix.job == 1
        env:
          DOCS_TESTS: ${{ steps.paths.outputs.docs_tests }}
        run: bash scripts/ci-static.sh docs
      - id: code
        if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs != 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      # BROWSER-TESTS-BENCH BB2/BB5 (J231): e2e's headless shell and products' Chromium, cached by Playwright version.
      - id: playwright
        if: steps.code.outputs.run == 'true'
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-pack-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Spawn parts' q11 Brotli bodies, kept by content (DL15); each one is checked against its body before use.
      - if: steps.code.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ring1-spawn-parts-br-${{ github.sha }}
          restore-keys: ring1-spawn-parts-br-
      # Every share plans the same suite: same tree, and quarantine judged at the run's own start,
      # not at whenever each job got a runner, so no file can fall between two shares' plans.
      - name: Judge exclusions at the run's start
        if: steps.code.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "WS_CI_EXCLUSION_AT=$(node -e "console.log(Date.parse(process.argv[1]))" "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)")" >> "$GITHUB_ENV"
      # LAND-SIMPLIFY LS2 (J250, J258): the planner's weights are main's last measured run, never a committed file.
      # Every share must plan from the same table, or shares pack different shards and skip files while green: the
      # newest main `timings-*` entry made before this run started, restored by its exact key. With none, the newest
      # earlier green run's artifacts; else defaults. An API failure fails the share, never a split plan.
      - name: Pick main's last measured test timings made before this run
        id: timings
        if: steps.code.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-timings.mjs pick --before="$WS_CI_EXCLUSION_AT"
      - if: steps.code.outputs.run == 'true' && steps.timings.outputs.key != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/timings
          key: ${{ steps.timings.outputs.key }}
          fail-on-cache-miss: true
      - name: With no cache, rebuild the timings from the newest earlier green run
        if: steps.code.outputs.run == 'true' && steps.timings.outputs.key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-timings.mjs fetch --strict --before="$WS_CI_EXCLUSION_AT"
      - name: Plan the smallest useful shards from actual discovery
        if: steps.code.outputs.run == 'true'
        run: node scripts/engine-ci-plan.ts --ordinary-workers=3
      # The packed static unit shellchecks the agent hook scripts at this exact version
      # (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      # Meta HOW-WE-BUILD MR6: hosted runners are Linux/X64, the Mac mini's VM
      # is Linux/ARM64; each archive is pinned by its own published sha256.
      - name: Install shellcheck 0.11.0
        if: steps.code.outputs.run == 'true'
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) arch=x86_64 sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Linux/ARM64) arch=aarch64 sum=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            *) echo "::error::no pinned shellcheck 0.11.0 for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.xz"
          echo "$sum  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Run this job's packed share
        id: pack
        if: steps.code.outputs.run == 'true'
        env:
          RING_RECORD: ${{ inputs.record && 'true' || 'false' }}
        run: node scripts/ci-pack.mjs --jobs=9 --job=${{ matrix.job }} --concurrency=2 --units=static,e2e,plan-proofs,tests,products
      - name: Retain actual membership, budget and timing evidence
        if: always() && steps.code.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-ci-${{ matrix.job }}
          path: |
            tmp/engine-ci
            tmp/ci-pack/*.json
            tmp/ring-cook/step.json
            tmp/template-e2e-ci/t1/results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep the recorded Ring 1 baseline
        if: inputs.record && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ring-digests
          path: test/pins/ring-digests.json
          retention-days: 7
      - name: Keep only this build's spawn-part encodings in the cache
        if: steps.pack.outputs.products == 'true'
        run: |
          cache=~/.cache/wildshard/gen/spawn-parts-br/1
          shopt -s nullglob
          for file in "$cache"/*.br; do
            name=$(basename "$file")
            [ -f "dist/assets/spawn/parts/${name:0:16}.pack.br" ] || rm -f "$file"
          done
          # S12d: phone 6x6 encodes no build read for three hours leave the cache (a hit refreshes the time).
          find "${cache%/1}/astc6-1" -name '*.ktx2' -mmin +180 -delete 2>/dev/null || true
          du -sh "$cache" 2>/dev/null || true
      - if: steps.pack.outputs.products == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ring1-spawn-parts-br-${{ github.sha }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-traces-${{ matrix.job }}
          path: |
            src/e2e/test-results/
            tmp/template-e2e-ci/t1/results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Record every shard's wall-budget verdict, artifact upload included (J193)
        if: always() && steps.code.outputs.run == 'true'
        run: node scripts/ci-pack.mjs --check-walls --job=${{ matrix.job }}
      # TEMPLATE-E2E T1E-2a: products already built Ring 1. Export those
      # exact bytes plus the Template pin read by POI and memory-server probes.
      - name: Bundle the shared Template suite build
        if: steps.pack.outputs.products == 'true'
        run: |
          WS_LANE_NAME=template-e2e-ci node scripts/scratch-dir.mjs template-e2e-ci "Shared Ring-1 client and Template pin"
      - name: Read the actual Template qualification receipts
        id: t1-policy
        if: steps.pack.outputs.products == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/t1-qualification.mjs
      - name: Run all Template suites on the producer runner
        if: steps.pack.outputs.products == 'true'
        continue-on-error: ${{ steps.t1-policy.outputs.blocking != 'true' }}
        env:
          WS_LANE_NAME: template-e2e-ci
          WS_T1_BUILD_DIR: dist
        # The packed product boot installs full Chromium with --no-shell.
        # T1's default launch needs the headless shell on this same runner.
        run: bash scripts/ci-playwright-install.sh --only-shell chromium && node scripts/t1-batch.mjs
      - name: Keep Template A receipt
        if: always() && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-e2e-A
          path: tmp/template-e2e-ci/t1/receipt-A.json
          retention-days: 7
          if-no-files-found: ${{ steps.t1-policy.outputs.blocking == 'true' && 'error' || 'warn' }}
      - name: Keep Template B receipt
        if: always() && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-e2e-B
          path: tmp/template-e2e-ci/t1/receipt-B.json
          retention-days: 7
          if-no-files-found: ${{ steps.t1-policy.outputs.blocking == 'true' && 'error' || 'warn' }}
      - name: Keep Template C receipt
        if: always() && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-e2e-C
          path: tmp/template-e2e-ci/t1/receipt-C.json
          retention-days: 7
          if-no-files-found: ${{ steps.t1-policy.outputs.blocking == 'true' && 'error' || 'warn' }}
      - name: Keep Template D receipt
        if: always() && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-e2e-D
          path: tmp/template-e2e-ci/t1/receipt-D.json
          retention-days: 7
          if-no-files-found: ${{ steps.t1-policy.outputs.blocking == 'true' && 'error' || 'warn' }}
      - name: Keep failing Template traces
        if: failure() && steps.pack.outputs.products == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-e2e-traces
          path: tmp/template-e2e-ci/t1/results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

  # Share nine reserves products plus T1 time; no consumer needs another runner.
  # Anchors preserve the same static checks, packed inventory and artifact policy.
  products:
    name: tests (${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs: *packed-outputs
    strategy:
      fail-fast: false
      matrix:
        job: [9]
    env: *packed-env
    steps: *packed-steps

  nine-ring1-build:
    # NB6 needs full Nine; the packed products unit installs only its server
    # slice. Preserve the standalone props check and measured street workload
    # policy without promoting or rewriting any pin or NB8/NB23 target.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code-run: ${{ steps.code.outputs.run }}
    env:
      WS_LANE_NAME: nine-ring1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # J400: classify here, beside products, rather than wait for its full
      # packed share. Its failure still gates the workflow independently.
      # Retain exact branch reuse and docs-only proof policy.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-exact-reuse.mjs ci.yml
      - id: paths
        if: steps.reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs
      - id: code
        if: steps.reuse.outputs.reused != 'true' && steps.paths.outputs.docs != 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: ./.github/actions/ring-setup
      - name: Own the benchmark scratch folder
        if: steps.code.outputs.run == 'true'
        run: node scripts/scratch-dir.mjs nine-ring1 'NB6 pinned Nine load and street ratchet'
      - name: Build full pinned Nine
        if: steps.code.outputs.run == 'true'
        run: node scripts/nine-ring1.mjs build
      - name: Archive the exact measured client
        if: steps.code.outputs.run == 'true'
        run: tar -cf tmp/nine-ring1/client.tar -C tmp/nine-ring1/preview dist
      - if: steps.code.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nine-ring1-client
          path: tmp/nine-ring1/client.tar
          retention-days: 1
          if-no-files-found: error

  nine-ring1:
    # The stock props load consumes the exact producer bytes and blocks.
    # Hosted street runs in ci-reports, so its cancellation or runner queue
    # cannot change or hold this workflow's verdict (NB6).
    needs: nine-ring1-build
    if: ${{ !cancelled() && needs.nine-ring1-build.outputs.code-run == 'true' && needs.nine-ring1-build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    # Fixed-run load took 261 s. Keep its existing cold-entry and
    # install/archive headroom; the street has its own report-only cap.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: load
            runner: ubuntu-latest
    env:
      WS_LANE_NAME: nine-ring1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - name: Own the benchmark scratch folder
        run: node scripts/scratch-dir.mjs nine-ring1 'NB6 exact client observation'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nine-ring1-client
          path: tmp/nine-ring1
      - name: Restore the exact client and install Chromium
        run: |
          mkdir -p tmp/nine-ring1/preview
          tar -xf tmp/nine-ring1/client.tar -C tmp/nine-ring1/preview
          rm tmp/nine-ring1/client.tar
          bash scripts/ci-playwright-install.sh chromium
      - name: Refuse this load regression
        run: node scripts/nine-ring1.mjs boot
      - name: Keep Nine measurements and stock boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nine-ring1-${{ matrix.kind }}
          path: |
            tmp/nine-ring1/street.json
            tmp/nine-ring1/boot
          retention-days: 7

  memory-ledger-guard:
    # EM35 uses a full production client. Nine stalled on hosted SwiftShader
    # at 180 s and 480 s (44239650390, 44246104563). Its ledger uses the
    # native WebKit job below.
    needs: nine-ring1-build
    if: ${{ !cancelled() && needs.nine-ring1-build.outputs.code-run == 'true' && needs.nine-ring1-build.result == 'success' && (inputs.pins_channel == '' || inputs.pins_channel == 'production') }}
    runs-on: ubuntu-latest
    # The full build took about 21 minutes and the first 20 boots about 18.
    # Regular comparisons boot each included zone once, inside 60 minutes.
    timeout-minutes: ${{ inputs.memory_record && 120 || 60 }}
    env:
      WS_LANE_NAME: memory-ledger
      WILDSHARD_CATALOGUE: test/pins/catalogue.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      # The full ledger's q11 parts are already decoded and hash-checked by
      # the app build. Keep its cache separate from the smaller Ring 1 build.
      - name: Key the full ledger Brotli cache
        id: ledger-codec
        continue-on-error: true
        env:
          CODEC_INPUTS: ${{ hashFiles('src/cook/game/spawnParts.ts') }}
          PART_INPUTS: ${{ hashFiles('test/pins/shardfiles.json', 'test/pins/catalogue.json', 'test/pins/assets.json', 'src/cook/game/entryDownloads.ts', 'src/cook/game/entryTotals.ts', 'src/cook/game/shardCook.ts', 'scripts/app-build/appCook.ts') }}
        run: |
          codec=$(node -p 'process.versions.brotli')
          [[ "$codec" =~ ^[0-9]+(\.[0-9]+)+$ ]] || exit 1
          [[ "$CODEC_INPUTS" =~ ^[a-f0-9]{64}$ && "$PART_INPUTS" =~ ^[a-f0-9]{64}$ ]] || exit 1
          prefix="full-ledger-spawn-parts-br-v1-$RUNNER_OS-$RUNNER_ARCH-$codec-$CODEC_INPUTS-"
          printf 'prefix=%s\nkey=%s%s\n' "$prefix" "$prefix" "$PART_INPUTS" >> "$GITHUB_OUTPUT"
      - name: Restore full-ledger Brotli parts
        id: ledger-parts
        if: steps.ledger-codec.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br/1
          key: ${{ steps.ledger-codec.outputs.key }}
          restore-keys: ${{ steps.ledger-codec.outputs.prefix }}
      - name: Build every production pin
        id: ledger-client
        run: |
          node scripts/scratch-dir.mjs memory-ledger 'EM35 full pinned ledger'
          if ! node scripts/pins.ts install; then
            echo 'Pinned input install failed. Retrying once.' >&2
            node scripts/pins.ts install
          fi
          node scripts/gen.mjs --inputs-only
          python3 scripts/heavy-lane.py build -- node scripts/build-app.mjs --outDir tmp/memory-ledger/preview/dist
          bash scripts/ci-playwright-install.sh chromium
      - name: Record the served ledger Brotli part digests
        continue-on-error: true
        run: |
          export LC_ALL=C
          cd tmp/memory-ledger/preview/dist/assets/spawn/parts
          sha256sum -- *.pack.br > "$GITHUB_WORKSPACE/tmp/memory-ledger/spawn-parts.sha256"
      - name: Read or block on subsystem ledger bytes
        env:
          MEMORY_RECORD: ${{ inputs.memory_record }}
          WS_LEDGER_RECORD_ZONES: ${{ inputs.memory_record_zones }}
        run: |
          baseline=()
          if [[ "$MEMORY_RECORD" != true ]]; then baseline+=(scripts/memory/ledger-ratchet.json); fi
          node scripts/memory/ci.mjs ledger tmp/memory-ledger/preview tmp/memory-ledger/readings "${baseline[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-ledger-guard
          path: |
            tmp/memory-ledger/readings/*.json
            tmp/memory-ledger/spawn-parts.sha256
          retention-days: 7
          if-no-files-found: ignore
      - name: Keep only encodings emitted by this full ledger build
        id: ledger-parts-pruned
        if: ${{ !cancelled() && steps.ledger-codec.outcome == 'success' && steps.ledger-client.outcome == 'success' && steps.ledger-parts.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          parts=tmp/memory-ledger/preview/dist/assets/spawn/parts
          cache="$HOME/.cache/wildshard/gen/spawn-parts-br/1"
          [[ -d "$parts" && -d "$cache" ]] || exit 1
          shopt -s nullglob
          for file in "$cache"/*.br; do
            name=${file##*/}
            [[ -f "$parts/${name:0:16}.pack.br" ]] || rm -- "$file"
          done
          kept=("$cache"/*.br)
          (( ${#kept[@]} > 0 ))
      - name: Save verified full-ledger Brotli parts
        if: ${{ !cancelled() && steps.ledger-parts-pruned.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br/1
          key: ${{ steps.ledger-codec.outputs.key }}

  nine-ledger-diagnostic:
    # This bounded experiment runs only on an explicit memory qualification.
    # It uses the standalone full Nine artifact from the same source run.
    needs: nine-ring1-build
    if: ${{ inputs.memory_record && !cancelled() && needs.nine-ring1-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      WS_LANE_NAME: nine-ring1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - run: node scripts/scratch-dir.mjs nine-ring1 'EM35 Nine SwiftShader checkpoint'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nine-ring1-client
          path: tmp/nine-ring1
      - name: Observe the last Chromium boot checkpoint
        run: |
          mkdir -p tmp/nine-ring1/preview
          tar -xf tmp/nine-ring1/client.tar -C tmp/nine-ring1/preview
          bash scripts/ci-playwright-install.sh chromium
          node scripts/nine-ring1.mjs diagnose-ledger-nine
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nine-ledger-diagnostic
          path: tmp/nine-ring1/ledger-nine-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore

  memory-footprint-guard:
    # EM36 reads native processes on the same hosted macOS runner as EM12.
    needs: nine-ring1-build
    if: ${{ !cancelled() && needs.nine-ring1-build.outputs.code-run == 'true' && needs.nine-ring1-build.result == 'success' && (inputs.pins_channel == '' || inputs.pins_channel == 'production') }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      WS_LANE_NAME: memory-footprint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - run: node scripts/scratch-dir.mjs memory-footprint 'EM36 native WebKit footprint'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nine-ring1-client
          path: tmp/memory-footprint
      - name: Read or block on settled Template WebContent
        env:
          MEMORY_RECORD: ${{ inputs.memory_record }}
        run: |
          mkdir -p tmp/memory-footprint/preview
          tar -xf tmp/memory-footprint/client.tar -C tmp/memory-footprint/preview
          bash scripts/ci-playwright-install.sh webkit
          baseline=()
          if [[ "$MEMORY_RECORD" != true ]]; then baseline+=(scripts/memory/footprint-ratchet.json); fi
          node scripts/memory/ci.mjs footprint tmp/memory-footprint/preview tmp/memory-footprint/readings "${baseline[@]}"
      - name: Read or block on Nine's native WebKit ledger
        env:
          MEMORY_RECORD: ${{ inputs.memory_record }}
        run: |
          baseline=()
          if [[ "$MEMORY_RECORD" != true ]]; then
            baseline+=(scripts/memory/webkit-ledger-ratchet.json)
          fi
          node scripts/memory/ci.mjs webkit-ledger tmp/memory-footprint/preview tmp/memory-footprint/readings "${baseline[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-footprint-guard
          path: tmp/memory-footprint/readings/*.json
          retention-days: 7
          if-no-files-found: ignore

  boundaries:
    # TS15: blocking after main run 43768938893's green soak, 2026-11-15. Cook Ring 1, attach, and play the same bytes.
    # Its own runner starts at t=0 (EV3b), never behind products.
    # CIQ1 (HOW-WE-BUILD): a plan/** run skips it, and main runs it on every push
    # without reusing the plan run, which no longer has it: each landed SHA still gets one run, on main.
    if: ${{ !startsWith(github.ref, 'refs/heads/plan/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # cook-to-play's build is a test build, never shipped: a paused production warns instead of failing it (as tests).
      WS_PREVIOUS_DEPLOY_OPTIONAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Classify from an actually green code-proving ancestor
        id: paths
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '0000000000000000000000000000000000000000' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs
      - id: code
        if: steps.paths.outputs.docs != 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      # The full pins, as the tests shares: the Ring 1 cook reads raw tarballs only `pnpm pins` fetches.
      - if: steps.code.outputs.run == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - id: playwright
        if: steps.code.outputs.run == 'true'
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - if: steps.code.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-pack-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: ms-playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.code.outputs.run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ring1-spawn-parts-br-${{ github.sha }}
          restore-keys: ring1-spawn-parts-br-
      - name: Cook, attach, and play the same bytes
        if: steps.code.outputs.run == 'true'
        run: node scripts/ci-pack.mjs --jobs=1 --job=1 --units=boundaries
      - name: Keep the report
        if: always() && steps.code.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-boundaries
          path: |
            tmp/engine-boundaries
            tmp/ci-pack/*.json
          retention-days: 7
          if-no-files-found: ignore
