name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Native proof files start their own workers; bound the outer pool too.
    env:
      WS_VITEST_MAX_WORKERS: '2'
      WS_TEST_QUARANTINE: blocking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - run: pnpm pins
      - run: pnpm gen:inputs
      - run: pnpm check
      - run: pnpm test:hooks

  e2e:
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Org git dependencies are public (J160, J163). pnpm-lock.yaml can record
      # them as git@github.com:..., so every URL form goes to plain HTTPS.
      - name: Read org repos over HTTPS
        run: |
          base="https://github.com/project-wildshard/"
          git config --global url."$base".insteadOf "git@github.com:project-wildshard/"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/project-wildshard/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: src/e2e/test-results/
          retention-days: 7

  quarantine:
    # J193: run every active quarantined proof with its ordinary exit code,
    # separately from the blocking verdict and its covered-commit summary.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - run: pnpm pins
      - run: pnpm gen:inputs
      - run: node scripts/test-quarantine.mjs
      - name: Keep the original quarantine results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-quarantine-results
          path: tmp/quarantine
          retention-days: 7

  verdict-coverage:
    needs: [check, e2e]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      # One run stands for every commit since the last finished run.
      - name: Name the commits this verdict covers
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=50" \
            --jq "[.workflow_runs[]|select(.status == \"completed\" and .conclusion != \"cancelled\" and .id != $GITHUB_RUN_ID)][0].head_sha // empty")
          test -n "$previous" || { echo 'No finished run to compare against'; exit 0; }
          commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq '.commits[]|"\(.sha[0:10]) \(.commit.message|split("\n")[0])"')
          range="${previous:0:10}..${GITHUB_SHA:0:10}"
          { echo "### Commits since the last finished run: $range"; echo '```'; echo "$commits"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in
            *' failure '*) echo "::error title=Red run covers $range::$(printf '%s\n' "$commits" | sed '/^$/d' | wc -l | tr -d ' ') commits after the last finished run; see this job's summary" ;;
          esac
