# J186: daily Ring 2 report remains outside TS15's validated push-half gate.
# Cold q11 cooking plus a clean build exceeds ten seconds: Ring 2.
# CI-JOB-PACKING (J244): a push no longer starts this workflow. Its push half, cook-to-play on Ring 1's products,
# is ci's blocking `boundaries` unit (scripts/ci-pack.mjs); its six Vitest files already run in ci's shards.
# The daily schedule and a dispatch still run the whole report, Ring 2 steps included.
name: engine-boundaries
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'
permissions:
  contents: read
concurrency:
  group: engine-boundaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ring-setup
      - run: node scripts/pins.ts install --ring 1
      - id: inputs
        run: pnpm gen:inputs
      # Ring 2: re-cutting five large raw heads is outside Ring 1.
      - name: Re-cut the pinned server slices
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/pins.ts verify-slices
      - name: Measure native play after host installation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node --experimental-transform-types --import ./scripts/bake-loader.mjs scripts/host-activity.ts tmp/engine-boundaries/host-activity.json
      - name: Real worker, hostile peers, and restore continuation
        run: node scripts/vitest-tmp.ts run test/cook-refusals.test.ts test/cook-hostile-pins.test.ts test/net-hostile-play.test.ts test/net-link-play.test.ts test/pinned-restore-play.test.ts
        env:
          WS_VITEST_MAX_WORKERS: '2'
          NET_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && github.run_id || '20261108' }}
          COOK_FUZZ_SEEDS: ${{ github.event_name == 'schedule' && github.run_id || '20261108' }}
      # TC27: an unrelated hostile-peer/restore report must not skip the
      # stored-product proof. A failed setup or cancellation still stops it.
      - id: browser
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        run: bash scripts/ci-playwright-install.sh chromium
      - name: Cook, attach, and play the same bytes
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: node scripts/cook-to-play.mjs --out=tmp/engine-boundaries
      - name: Plant and heal actual cold-cook faults
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        run: node scripts/coverage-cook-drill.mjs tmp/engine-boundaries/cook-drill
      - name: Check the full Nalati server herd tick budget
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node --experimental-transform-types --import ./scripts/sim-node-loader.mjs --test test/nalati-herd-tick.proof.ts
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-boundaries
          path: tmp/engine-boundaries
          retention-days: 7
      - name: Remove this run's output
        if: always()
        run: node -e "require('node:fs').rmSync('tmp/engine-boundaries', {recursive:true,force:true})"
  # EG-31: released saves name the current immutable pins, including Blender's
  # changed level. Ring 1 intentionally installs the format's older frozen hall.
  # Keep this proof independent of the hostile/cold-cook report and its inputs.
  released-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ring-setup
      - run: node scripts/pins.ts install
      - run: pnpm gen:inputs
      - name: Resume actual released saves against the current pinned worlds
        run: node scripts/vitest-tmp.ts run test/released-save-play.test.ts
  # EG26: JavaScriptCore is a separate engine from Chromium/V8. Report-only Ring 2; never a hook or push test.
  worker-determinism:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - run: node scripts/pins.ts install --ring 1
      - run: bash scripts/ci-playwright-install.sh webkit
      # Both sides use committed boot tables. Generation after the frozen Ring 1 install would dirty them.
      - name: Compare the same real tape in Node and a WebKit worker
        run: node --experimental-transform-types --import ./scripts/sim-node-loader.mjs scripts/determinism/report.ts
        env:
          WILDSHARD_RING: '1'
      - name: Keep the worker comparison and divergent-tape control
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-determinism
          path: tmp/worker-determinism/report.json
          retention-days: 7
      - name: Remove this run's output
        if: always()
        run: node -e "require('node:fs').rmSync('tmp/worker-determinism', {recursive:true,force:true})"
  # EG-20 (meta TEST-COVERAGE row 32): the shipped title and grid against the immutable pins, on its own and blocking. Inside the
  # report job it was skipped whenever an earlier step went red (every scheduled run 2026-11-12 to 11-15) and `continue-on-error`
  # called that green. Ring 2: all 28 real products and a clean build exceed ten seconds.
  catalogue:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      # S12d: the app build's phone 6x6 encodes ride the spawn-part cache (a cold full-pin cook is minutes).
      # FS30 (J505): ci's verified full-ledger parts first, so a full build never re-encodes them (the Ring 1
      # subset alone sent the nightly's Chromium heads into an 1800 s re-encode).
      - name: Key the full-ledger encodes
        id: ledger-key
        uses: ./.github/actions/full-ledger-key
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ${{ steps.ledger-key.outputs.key || format('ring1-spawn-parts-br-{0}', github.sha) }}
          restore-keys: |
            ${{ steps.ledger-key.outputs.prefix }}
            ${{ steps.ledger-key.outputs.linux-key }}
            ${{ steps.ledger-key.outputs.linux-prefix }}
            nightly-encodes-
            ring1-spawn-parts-br-
      - name: Census all pinned title and grid heads
        run: |
          node scripts/pins.ts install
          pnpm build:game
          node scripts/app-build/splitOutput.mjs dist --join
          node --import ./scripts/bake-loader.mjs scripts/catalogue-all-heads.ts dist
