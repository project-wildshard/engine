name: server-release

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  push:
    tags: ['v[0-9]*']
  # Staging alignment: sign a named green main build whose packs are already on R2. Forward only (J234): the
  # build must descend from the one staging names. This is how a held build goes live once its packs land.
  workflow_dispatch:
    inputs:
      build:
        description: Full 40-character green main SHA whose server book and parts are published
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Duplicate CI completion events for one SHA serialize; different SHAs use R2 CAS.
concurrency:
  group: server-release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.build || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'project-wildshard/engine' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      sha: ${{ steps.source.outputs.sha }}
      channel: ${{ steps.source.outputs.channel }}
      tag: ${{ steps.source.outputs.tag }}
      align: ${{ steps.source.outputs.align }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: ./.github/actions/org-deps
      - run: pnpm install --frozen-lockfile --config.ci=false
      - name: Admit exact green main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ALIGN_BUILD: ${{ inputs.build }}
        run: node scripts/server-release/github.mjs select

  publish:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      ALIGN_FLAG: ${{ needs.source.outputs.align == 'true' && '--align' || '' }}
    # J234: every run signs with main's current publisher, so the packs gate and fix-forward rules hold even for an
    # older source (a late CI event); the bundle is built and checked in the source's own tree under ./source.
    # A tag push runs the workflow file at its tag, so a tag on a commit from before this file would run its old
    # publisher: never tag one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: ./.github/actions/org-deps
      - run: pnpm install --frozen-lockfile --config.ci=false
      - name: Install the source's own tree
        working-directory: source
        run: pnpm install --frozen-lockfile --config.ci=false
      # The same bytes CI built for this SHA: the asset step refuses a tag asset that differs, so no run can
      # sign a replaced archive.
      - name: Build deterministic dedicated bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-server.mjs --build "$SOURCE_SHA" --out "$RUNNER_TEMP/server"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -C "$RUNNER_TEMP/server" . |
            gzip -n > "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz"
      - name: Validate channel configuration
        env:
          E7_RELEASE_SIGNING_KEY: ${{ secrets.E7_RELEASE_SIGNING_KEY }}
          E7_RELEASE_PUBLIC_KEY: ${{ vars.E7_RELEASE_PUBLIC_KEY }}
          E7_RELEASE_SOCKET: ${{ vars[format('E7_{0}_SOCKET', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          E7_SERVER_SHARDS: ${{ vars[format('E7_{0}_SHARDS', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_PACKS: ${{ vars.R2_BUCKET_PACKS }}
          R2_PACKS_ACCESS_KEY_ID: ${{ secrets.R2_PACKS_ACCESS_KEY_ID }}
          R2_PACKS_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKS_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/server-release/publish.mjs --check
          --channel "$RELEASE_CHANNEL" --build "$SOURCE_SHA" --tag "$RELEASE_TAG"
          --bundle "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz" --out "$RUNNER_TEMP/release.json" $ALIGN_FLAG
      - name: Upload immutable bundle to its tag release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/server-release/github.mjs asset
          "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz" "$RELEASE_CHANNEL"
      # Every channel signs only a build whose server book and parts are on R2 (publish.mjs `serverPacksReady`, J234); otherwise it holds.
      - name: Sign and advance the channel release file
        env:
          E7_RELEASE_SIGNING_KEY: ${{ secrets.E7_RELEASE_SIGNING_KEY }}
          E7_RELEASE_PUBLIC_KEY: ${{ vars.E7_RELEASE_PUBLIC_KEY }}
          E7_RELEASE_SOCKET: ${{ vars[format('E7_{0}_SOCKET', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          E7_SERVER_SHARDS: ${{ vars[format('E7_{0}_SHARDS', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_PACKS: ${{ vars.R2_BUCKET_PACKS }}
          R2_PACKS_ACCESS_KEY_ID: ${{ secrets.R2_PACKS_ACCESS_KEY_ID }}
          R2_PACKS_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKS_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/server-release/publish.mjs
          --channel "$RELEASE_CHANNEL" --build "$SOURCE_SHA" --tag "$RELEASE_TAG"
          --bundle "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz" --out "$RUNNER_TEMP/release.json" $ALIGN_FLAG

  # HOW-WE-BUILD ENG-16 (SHARD-AUTHORING SA15, J314): the devserver client an installed `wildshard dev` serves, on the same
  # release as the dedicated bundle (`server-staging-<sha>` or `vX.Y.Z`), so sharddev fetches it at its engine pin
  # (sharddev src/sharddev/devClient.ts). After publish, which makes the release; a held or failed publish leaves the release
  # in place, so the client still goes up. The first upload wins: a rerun keeps the asset already there.
  devserver-client:
    needs: [source, publish]
    if: always() && needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Skip a source from before ENG-16
        id: has
        run: if [ -f scripts/devserver-client.mjs ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$SOURCE_SHA has no scripts/devserver-client.mjs"; fi
      - if: steps.has.outputs.build == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - name: Build the devserver client
        if: steps.has.outputs.build == 'true'
        run: |
          node scripts/pins.ts install
          node scripts/gen.mjs --inputs-only
          python3 scripts/heavy-lane.py build -- node scripts/devserver-client.mjs --out "$RUNNER_TEMP/devserver-client.tar.gz"
      - name: Upload it to the release, once
        if: steps.has.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"; then
            echo "::warning::no release $RELEASE_TAG for $SOURCE_SHA: publish made none"; exit 0
          fi
          if grep -qx 'devserver-client.tar.gz' "$RUNNER_TEMP/assets.txt"; then echo "::notice::$RELEASE_TAG already has its devserver client"; exit 0; fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/devserver-client.tar.gz" --repo "$GITHUB_REPOSITORY"
