name: server-release

on:
  workflow_run:
    workflows: [ci]
    branches: ['release/**']
    types: [completed]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Staging alignment: sign a named green release-branch build whose packs are already on R2. Forward only (J234): the
  # build must descend from the one staging names. This is how a held build goes live once its packs land.
  workflow_dispatch:
    inputs:
      build:
        description: Full 40-character green release-branch SHA whose server book and parts are published
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: >-
      github.repository == 'project-wildshard/engine' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      sha: ${{ steps.source.outputs.sha }}
      channel: ${{ steps.source.outputs.channel }}
      tag: ${{ steps.source.outputs.tag }}
      align: ${{ steps.source.outputs.align }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: ./.github/actions/org-deps
      - run: pnpm install --frozen-lockfile --config.ci=false
      - name: Admit exact green release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ALIGN_BUILD: ${{ inputs.build }}
        run: node scripts/server-release/github.mjs select

  publish:
    needs: source
    if: needs.source.outputs.ready == 'true'
    # Serialize publication for an exact build and channel. Different builds use R2 CAS.
    concurrency:
      group: server-release-sign-${{ needs.source.outputs.channel }}-${{ needs.source.outputs.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      ALIGN_FLAG: ${{ needs.source.outputs.align == 'true' && '--align' || '' }}
    # J234: every run signs with main's current publisher, so the packs gate and fix-forward rules hold even for an
    # older source (a late CI event); the bundle is built and checked in the source's own tree under ./source.
    # A tag push runs the workflow file at its tag, so a tag on a commit from before this file would run its old
    # publisher: never tag one.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
      - uses: ./.github/actions/org-deps
      - run: pnpm install --frozen-lockfile --config.ci=false
      - name: Install the source's own tree
        working-directory: source
        run: pnpm install --frozen-lockfile --config.ci=false
      # The source's scripts/server-release/production-grid-plan.json, when
      # present, names the exact heads of the proposed placement and status changes.
      - name: Play advertised and planned production heads on the candidate
        if: env.RELEASE_CHANNEL == 'production'
        id: production-play
        working-directory: source
        run: >-
          node --experimental-transform-types --import ./scripts/bake-loader.mjs
          scripts/release-prod-play.ts "$SOURCE_SHA" "$RUNNER_TEMP/production-play.json"
      - name: Keep the production play verdict
        if: ${{ !cancelled() && (steps.production-play.outcome == 'success' || steps.production-play.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-play
          path: ${{ runner.temp }}/production-play.json
          if-no-files-found: ignore
      # The same bytes CI built for this SHA: the asset step refuses a tag asset that differs, so no run can
      # sign a replaced archive.
      - name: Build deterministic dedicated bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-server.mjs --build "$SOURCE_SHA" --out "$RUNNER_TEMP/server"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -C "$RUNNER_TEMP/server" . |
            gzip -n > "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz"
      - name: Validate channel configuration
        env:
          E7_RELEASE_SIGNING_KEY: ${{ secrets.E7_RELEASE_SIGNING_KEY }}
          E7_RELEASE_PUBLIC_KEY: ${{ vars.E7_RELEASE_PUBLIC_KEY }}
          E7_RELEASE_SOCKET: ${{ vars[format('E7_{0}_SOCKET', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          E7_SERVER_SHARDS: ${{ vars[format('E7_{0}_SHARDS', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_PACKS: ${{ vars.R2_BUCKET_PACKS }}
          R2_PACKS_ACCESS_KEY_ID: ${{ secrets.R2_PACKS_ACCESS_KEY_ID }}
          R2_PACKS_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKS_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/server-release/publish.mjs --check
          --channel "$RELEASE_CHANNEL" --build "$SOURCE_SHA" --tag "$RELEASE_TAG"
          --bundle "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz" --out "$RUNNER_TEMP/release.json" ${ALIGN_FLAG:+"$ALIGN_FLAG"}
      - name: Upload immutable bundle to its tag release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/server-release/github.mjs asset
          "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz" "$RELEASE_CHANNEL"
      # Every channel signs only a build whose server book and parts are on R2 (publish.mjs `serverPacksReady`, J234); otherwise it holds.
      - name: Sign and advance the channel release file
        env:
          E7_RELEASE_SIGNING_KEY: ${{ secrets.E7_RELEASE_SIGNING_KEY }}
          E7_RELEASE_PUBLIC_KEY: ${{ vars.E7_RELEASE_PUBLIC_KEY }}
          E7_RELEASE_SOCKET: ${{ vars[format('E7_{0}_SOCKET', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          E7_SERVER_SHARDS: ${{ vars[format('E7_{0}_SHARDS', needs.source.outputs.channel == 'production' && 'PRODUCTION' || 'STAGING')] }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_PACKS: ${{ vars.R2_BUCKET_PACKS }}
          R2_PACKS_ACCESS_KEY_ID: ${{ secrets.R2_PACKS_ACCESS_KEY_ID }}
          R2_PACKS_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKS_SECRET_ACCESS_KEY }}
        run: >-
          node scripts/server-release/publish.mjs
          --channel "$RELEASE_CHANNEL" --build "$SOURCE_SHA" --tag "$RELEASE_TAG"
          --bundle "$RUNNER_TEMP/engine-server-$SOURCE_SHA.tar.gz" --out "$RUNNER_TEMP/release.json" ${ALIGN_FLAG:+"$ALIGN_FLAG"}

  # HOW-WE-BUILD ENG-16 (SHARD-AUTHORING SA15, J314): the devserver client an installed `wildshard dev` serves, on the same
  # release as the dedicated bundle (`server-staging-<sha>` or `vX.Y.Z`), so sharddev fetches it at its engine pin
  # (sharddev src/sharddev/devClient.ts). After publish, which makes the release; a held or failed publish leaves the release
  # in place, so the client still goes up (no release skips with a warning; any other read failure is red). The first upload wins: a rerun keeps the asset already there.
  # SHARD-AUTHORING SA43: the same job packs the preparation client `wildshard prepare` serves (`preparation-client.tar.gz`,
  # a WILDSHARD_PREPARATION_ONLY production build); a source from before SA43 has no `--kind` and packs only the first.
  devserver-client:
    needs: [source, publish]
    if: ${{ !cancelled() && needs.source.outputs.ready == 'true' }}
    # Both server-release entry points may attach archives to the same tag.
    concurrency:
      group: server-release-clients-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      WS_BUILD_ID: ${{ needs.source.outputs.sha }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Skip a source from before ENG-16
        id: has
        run: |
          if [ -f scripts/devserver-client.mjs ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$SOURCE_SHA has no scripts/devserver-client.mjs"; fi
          if grep -q PREPARATION_CLIENT_ASSET scripts/devserver-client.mjs 2>/dev/null; then echo "preparation=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has.outputs.build == 'true'
        uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      # FAST-RELEASE FR-A1 (FS30, J505): ci's verified full-ledger spawn parts first, so the devserver and preparation
      # clients never re-encode every q11 part cold (29 min median, 6 of 25 runs red at heavy-lane's cap, 11-23..24).
      - name: Key the full-ledger encodes
        if: steps.has.outputs.build == 'true'
        id: ledger-key
        continue-on-error: true
        uses: ./.github/actions/full-ledger-key
      - name: Restore spawn and phone texture encodes
        if: steps.has.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ${{ steps.ledger-key.outputs.key || format('nightly-encodes-{0}', needs.source.outputs.sha) }}
          restore-keys: |
            ${{ steps.ledger-key.outputs.prefix }}
            ${{ steps.ledger-key.outputs.linux-key }}
            ${{ steps.ledger-key.outputs.linux-prefix }}
            nightly-encodes-
            ring1-spawn-parts-br-
      - name: Build the devserver client
        if: steps.has.outputs.build == 'true'
        run: |
          node scripts/pins.ts install
          node scripts/gen.mjs --inputs-only
          python3 scripts/heavy-lane.py build -- node scripts/devserver-client.mjs --out "$RUNNER_TEMP/devserver-client.tar.gz"
      - name: Build the preparation client
        if: steps.has.outputs.preparation == 'true'
        run: python3 scripts/heavy-lane.py build -- node scripts/devserver-client.mjs --kind preparation --out "$RUNNER_TEMP/preparation-client.tar.gz"
      - name: Upload it to the release, once
        if: ${{ !cancelled() && steps.has.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_REQUIRED: ${{ steps.has.outputs.preparation }}
        run: |
          set -o pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt" 2> "$RUNNER_TEMP/view.err"; then
            if grep -qi 'release not found' "$RUNNER_TEMP/view.err"; then echo "::warning::no release $RELEASE_TAG for $SOURCE_SHA: publish made none"; exit 0; fi
            cat "$RUNNER_TEMP/view.err"; exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          for asset in devserver-client.tar.gz preparation-client.tar.gz; do
            [ -f "$RUNNER_TEMP/$asset" ] || continue
            if grep -Fxq "$asset" "$RUNNER_TEMP/assets.txt"; then echo "::notice::$RELEASE_TAG already has $asset"; continue; fi
            tar -xOzf "$RUNNER_TEMP/$asset" ./version.json |
              jq -e --arg sha "$SOURCE_SHA" --arg version "$version" --arg asset "$asset" '
                .build == $sha and .clientVersion == $version and
                ((.preparationOnly // false) == ($asset == "preparation-client.tar.gz"))
              ' >/dev/null
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$asset" --repo "$GITHUB_REPOSITORY"
          done
          if [ "$PREPARATION_REQUIRED" = true ] && [ ! -f "$RUNNER_TEMP/preparation-client.tar.gz" ] &&
            ! grep -Fxq preparation-client.tar.gz "$RUNNER_TEMP/assets.txt"; then
            echo "::error::Missing preparation-client.tar.gz for $SOURCE_SHA"
            exit 1
          fi
