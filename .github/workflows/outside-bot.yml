name: outside-staging-bot
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
  # Observe a source change before it reaches main; dispatch/schedule remain available.
  push:
    paths:
      - .github/workflows/outside-bot.yml
      - src/scripts/mmo-bots.mjs
      - test/fixtures/dedicated/outsideJourney.ts
      - test/fixtures/dedicated/outsideBotEntry.ts
      - test/outside-journey.proof.mjs
      - test/fixtures/dedicated/roomBench.ts
      - test/fixtures/dedicated/roomBot.ts
      - vite/rapier.ts
permissions:
  contents: read
concurrency:
  group: outside-staging-bot
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'project-wildshard/engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - run: node src/scripts/pins.ts install
      - name: Prepare the installed physics asset without a cook
        run: node --input-type=module -e 'import {copyRapierWasm} from "./vite/rapier.ts"; copyRapierWasm();'
      # J186: separate actual proof observations; a green job alone is not evidence.
      # Review no earlier than November 23 after an actual green week.
      - name: Observe real gateway walk, fight, reconnect and missing-witness refusal
        timeout-minutes: 1
        run: |
          mkdir -p tmp/tc45-outside
          timeout --signal=TERM --kill-after=5s 10s node --import ./src/scripts/sim-node-loader.mjs --test --test-timeout=10000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=tmp/tc45-outside/proof.xml test/outside-journey.proof.mjs
      - name: One ordinary bot from this runner through the staging Tunnel
        if: ${{ !cancelled() }}
        run: node src/scripts/mmo-bots.mjs staging --outside-proof --bots 1 --seconds 60 --keep --work-dir tmp/tc45-outside/live
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outside-staging-bot
          path: |
            tmp/tc45-outside/proof.xml
            tmp/tc45-outside/live/**/report.json
            tmp/tc45-outside/live/**/run.log
            tmp/tc45-outside/live/**/bots.log
          if-no-files-found: error
          retention-days: 14
