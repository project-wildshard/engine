# TEST-COVERAGE row 46, XR-7 to XR-9 (meta docs/plans/test-coverage/END-TO-END.md): a phone without a phone. Mobile Safari
# in an iOS Simulator (hosted macOS) and Chrome in an Android emulator (hosted Linux, KVM) each go title to play on
# staging.wildshard.io, walk on a real touch, then meet in one Driftwood room and draw each other. A proof against the live
# staging page (J186, J205): it reports, never gates, and holds no secret, so it runs on a schedule and never on a fork.
# Changing the proof or this file re-runs it on that push, any branch.
name: phones
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/staging-phones-proof.mjs
      - .github/workflows/phones.yml
permissions:
  contents: read
concurrency:
  group: phones-${{ github.ref }}
  cancel-in-progress: false
env:
  WS_LANE_NAME: phones
jobs:
  safari:
    if: github.repository == 'project-wildshard/engine'
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - name: Install the Web Inspector proxy and idb
        run: |
          # idb-companion has no bottle here and builds only with a full Xcode 26: select the newest one the image carries.
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "xcode $xcode"
          sudo xcode-select -s "$xcode"
          brew install ios-webkit-debug-proxy facebook/fb/idb-companion
          pipx install fb-idb
          idb --help > /dev/null
      - name: Boot an iPhone Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            const rows = Object.entries(JSON.parse(require("fs").readFileSync(0, "utf8")).devices)
              .filter(([runtime]) => runtime.includes("SimRuntime.iOS"))
              .flatMap(([runtime, list]) => list.map(each => ({ ...each, version: runtime.split("iOS-")[1].split("-").map(Number) })))
              .filter(each => /^iPhone \d+ Pro$/u.test(each.name))
              .sort((a, b) => b.version[0] - a.version[0] || (b.version[1] ?? 0) - (a.version[1] ?? 0) || b.name.localeCompare(a.name));
            if (rows.length === 0) process.exit(1);
            console.error(`${rows[0].name} iOS ${rows[0].version.join(".")}`); console.log(rows[0].udid);')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: XR-7
        # --solo until the Android leg boots Chrome (row 46): XR-9 needs both phones in the room.
        run: node scripts/staging-phones-proof.mjs --device=safari --solo --tag="$(printf '%s%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tail -c 9)" --out=tmp/staging-phones
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phones-safari
          path: tmp/staging-phones/**
          if-no-files-found: warn
          retention-days: 14
  android:
    if: github.repository == 'project-wildshard/engine'
    runs-on: ubuntu-24.04
    # Open (row 46, XR-8): Chrome starts and loads staging on the API 37 emulator; the touch walk is not yet proved here.
    continue-on-error: true
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
      - name: Give the emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot an Android emulator with Chrome
        run: |
          bin="$ANDROID_HOME/cmdline-tools/latest/bin" adb="$ANDROID_HOME/platform-tools/adb"
          # avdmanager and the emulator look in different homes unless told one
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME" tmp/staging-phones
          list=$("$bin/sdkmanager" --list 2>/dev/null | grep -oE 'system-images;android-[0-9.]+;google_apis;x86_64' | sort -uV)
          newest=$(echo "$list" | tail -1) api36=$(echo "$list" | grep -m1 'android-36;' || true)
          echo "images: newest $newest, api 36 ${api36:-none}"
          yes | "$bin/sdkmanager" --install emulator platform-tools > /dev/null
          # XR-8 (run 43881038858): the API 37 emulator booted, then its launcher ANRed (input dispatching timed out) and
          # Chrome had no process 25 s after `am start`, on every software renderer. Each attempt now: 4 cores (all the
          # runner has), error dialogs hidden and animations off, the launcher disabled (its ANR held input), a 60 s settle
          # for boot-time package work, Chrome's first-run flags before its first start, `am start -W` and a 3-minute wait
          # for Chrome's process. API 36 is the last fallback (its Chrome must be 137+ for WebCrypto Ed25519).
          up=0
          # Run 43977695438: on `swiftshader_indirect` (the GLES translator) the page failed on a WebGL fence wait (0x911d,
          # GL_WAIT_FAILED); `swangle_indirect` is ANGLE over SwiftShader Vulkan, which plays at 1 to 2 fps (local API 37).
          for attempt in "$newest swangle_indirect" "$newest swiftshader_indirect" "${api36:-$newest} swangle_indirect"; do
            set -- $attempt; image=$1 gpu=$2 tag="$(echo "$image" | grep -oE 'android-[0-9.]+')-$gpu"
            echo "::group::attempt $tag"
            yes | "$bin/sdkmanager" --install "$image" > /dev/null
            echo no | "$bin/avdmanager" create avd -n xr8 -k "$image" -d pixel_7 --force > /dev/null
            # The stock data partition fills up before Chrome starts (No space left on device): 8 GB, wiped each boot.
            nohup "$ANDROID_HOME/emulator/emulator" -avd xr8 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
              -camera-back none -camera-front none -gpu "$gpu" -memory 4096 -cores 4 -partition-size 8192 -wipe-data \
              > "tmp/staging-phones/emulator-$tag.log" 2>&1 &
            timeout 120 "$adb" wait-for-device || true
            booting=$SECONDS
            timeout 420 bash -c "until [ \"\$('$adb' shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 3; done" || true
            echo "boot_completed after $((SECONDS - booting)) s"
            "$adb" shell 'settings put global hide_error_dialogs 1; settings put global window_animation_scale 0;
              settings put global transition_animation_scale 0; settings put global animator_duration_scale 0;
              settings put global package_verifier_enable 0; svc power stayon true; wm dismiss-keyguard; input keyevent KEYCODE_WAKEUP' || true
            "$adb" shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            "$adb" shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS > /dev/null || true
            sleep 60
            "$adb" shell 'echo "chrome --disable-fre --no-default-browser-check --no-first-run --ignore-gpu-blocklist --mute-audio" > /data/local/tmp/chrome-command-line;
              chmod 644 /data/local/tmp/chrome-command-line; am set-debug-app --persistent com.android.chrome' || true
            "$adb" shell dumpsys package com.android.chrome | grep -m1 versionName || true
            timeout 240 "$adb" shell am start -W -a android.intent.action.VIEW -n com.android.chrome/com.google.android.apps.chrome.Main \
              -d https://staging.wildshard.io/version.json || true
            timeout 180 bash -c "until '$adb' shell pidof com.android.chrome > /dev/null 2>&1; do sleep 5; done" || true
            if [ "$("$adb" get-state 2>/dev/null)" = device ] && "$adb" shell pidof com.android.chrome > /dev/null; then
              echo "attempt $tag holds Chrome"; echo "::endgroup::"; up=1; break
            fi
            echo "attempt $tag lost the emulator or Chrome"
            "$adb" shell 'ps -A | grep -i chrom; dumpsys activity activities | grep -i -m3 resumed' || true
            "$adb" logcat -d -t 4000 > "tmp/staging-phones/logcat-$tag.txt" || true
            grep -E "ANR in|FATAL|AndroidRuntime|ActivityTaskManager.*chrome|Process com.android.chrome|chromium.*(error|fatal)" "tmp/staging-phones/logcat-$tag.txt" | head -40 || true
            "$adb" emu kill || true; pkill -f qemu-system || true; sleep 5
            echo "::endgroup::"
          done
          [ "$up" = 1 ] || { echo "no attempt started Chrome"; exit 1; }
          # Run 43967117784: Chrome 145 drew its tab, but its DevTools socket refused every connect for 90 s. Chrome opens
          # `chrome_devtools_remote` only with USB debugging and developer options both on; restart it to read them.
          "$adb" shell 'settings put global development_settings_enabled 1; settings put global adb_enabled 1' || true
          "$adb" shell 'getprop ro.debuggable; settings get global adb_enabled; settings get global development_settings_enabled' || true
          "$adb" shell am force-stop com.android.chrome
          "$adb" shell am start -W -a android.intent.action.VIEW -n com.android.chrome/com.google.android.apps.chrome.Main -d about:blank || true
          if timeout 60 bash -c "until '$adb' shell cat /proc/net/unix | grep -q chrome_devtools_remote; do sleep 3; done"; then
            echo "Chrome's DevTools socket is open"
          else
            echo "Chrome's DevTools socket never opened"; "$adb" shell 'cat /proc/net/unix | grep -i devtools' || true
          fi
          "$adb" shell am force-stop com.android.chrome
          # Run 43977695438's Chrome said `pointer: fine`: say which input devices the emulator gave the guest.
          "$adb" shell dumpsys input | grep -E "^    [0-9]+: |Sources:" | head -24 || true
          echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
      - name: XR-8
        run: node scripts/staging-phones-proof.mjs --device=android --solo --tag="$(printf '%s%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tail -c 9)" --out=tmp/staging-phones
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phones-android
          path: tmp/staging-phones/**
          if-no-files-found: warn
          retention-days: 14
