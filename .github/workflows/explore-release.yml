# Meta EXPLORE-MODE EX9 (Jake, 2026-11-21 ~12:45 Cancún: "yes approved"; J482): explore.wildshard.io follows every staging
# release, published from Actions so nobody runs it by hand and either machine can start it. It replaces the hand steps in
# project/journal/2026-11-19-explore-release.md. On a release tag (and on a dispatch naming one) it checks out that tag's
# commit, waits until staging serves that build, takes staging's own catalogue.json, and releases the Explore Worker
# (pages/wrangler.jsonc --env explore) with src/scripts/page-release.mjs in order: build, upload, check (the version URL's
# bytes equal the local build), then `wrangler triggers deploy --env explore` (the explore.wildshard.io custom domain),
# then go-live. test/explore-release-ci.test.ts holds that order: go-live never runs before check.
# Explore signs no world, moves no rooms and publishes no server packs.
name: explore-release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag staging serves (vX.Y.Z, or server-staging-<sha> before the release is tagged)
        type: string
        required: true

env:
  WS_AGENT_UA: WildshardAgent/1 (ci-explore-release)

permissions:
  contents: read

concurrency:
  group: explore-release
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # staging serves a release branch's head (tagged server-staging-<sha>) before finish tags it vX.Y.Z: a dispatch may name either
      - name: Refuse anything but a release tag
        run: |
          [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|server-staging-[0-9a-f]{40})$ ]] || { echo "::error::$TAG is not a release tag (vX.Y.Z or server-staging-<sha>)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
      # page-release's explore check confirms staging's signed release and live page name this commit: wait for staging
      # to serve the tag (a tag can land before the staging page moves), then take staging's exact catalogue
      - name: Wait for staging to serve the tag, and take its catalogue
        run: |
          build=$(git rev-parse HEAD)
          for attempt in $(seq 1 30); do
            live=$(curl -A "$WS_AGENT_UA" -fsS -m 20 "https://staging.wildshard.io/version.json?t=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).build)}catch{console.log('')}})" || true)
            [ "$live" = "$build" ] && break
            echo "staging serves ${live:-unknown}, not $TAG ($build): waiting ($attempt of 30)"
            sleep 60
          done
          [ "$live" = "$build" ] || { echo "::error::staging never served $TAG ($build)"; exit 1; }
          mkdir -p tmp/explore-release
          curl -A "$WS_AGENT_UA" -fsS -m 60 -o tmp/explore-release/catalogue.json "https://staging.wildshard.io/catalogue.json?t=$(date +%s)"
          echo "staging serves $TAG ($build); its catalogue is $(wc -c < tmp/explore-release/catalogue.json) bytes"
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      # FAST-RELEASE FR-A1 (FS30, J505): ci's verified full-ledger spawn parts first (content-addressed, so staging's
      # catalogue reuses every part main's ci already encoded); the cold build was 53 of this job's 54 minutes.
      - name: Key the full-ledger encodes
        id: ledger-key
        continue-on-error: true
        uses: ./.github/actions/full-ledger-key
      - name: Restore spawn and phone texture encodes
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/wildshard/gen/spawn-parts-br
          key: ${{ steps.ledger-key.outputs.key || format('nightly-encodes-{0}', github.sha) }}
          restore-keys: |
            ${{ steps.ledger-key.outputs.prefix }}
            ${{ steps.ledger-key.outputs.linux-key }}
            ${{ steps.ledger-key.outputs.linux-prefix }}
            nightly-encodes-
            ring1-spawn-parts-br-
      # staging's catalogue cooks every pin on a cold runner (over 30 minutes, run 44939791409): an hour for the build.
      # A tag before 5ed4f16dc has heavy-lane's fixed 30 minutes in its build:game; give it the same knob, and hide that
      # one-line local edit from page-release's clean-tree check (skip-worktree), so an older release can still publish.
      - name: Give an older tag's build the same limit
        run: |
          grep -q WS_BUILD_MAX_MINUTES package.json && exit 0
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const s=p.scripts['build:game'];if(!s.startsWith('python3 src/scripts/heavy-lane.py build -- '))process.exit(1);p.scripts['build:game']=s.replace('build -- ','build --max \"\${WS_BUILD_MAX_MINUTES:-30}\" -- ');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git update-index --skip-worktree package.json
          echo "$TAG predates the knob: build:game patched locally to WS_BUILD_MAX_MINUTES"
      # The Cloudflare token reaches wrangler only through the environment; page-release.mjs redacts it from all output.
      # PV15: Explore borrows the signed staging cook, like preview. The build and check use the same table.
      - name: Borrow the staging cook table
        run: node --import ./src/scripts/bake-loader.mjs src/scripts/page-release/zone-table.mjs build tmp/explore-release/zone-table.json
      - name: Build, upload and check the Explore page
        env:
          WS_BUILD_MAX_MINUTES: 60
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node src/scripts/page-release.mjs explore build,upload,check --catalogue=tmp/explore-release/catalogue.json --zone-table=tmp/explore-release/zone-table.json
      - name: Attach explore.wildshard.io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler triggers deploy --config pages/wrangler.jsonc --env explore
      - name: Go live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node src/scripts/page-release.mjs explore go-live
          echo "explore.wildshard.io serves $TAG ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
