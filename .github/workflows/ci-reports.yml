name: ci-reports
# J400: report-only work never holds the main verdict open.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, 'release/**']
permissions:
  contents: read
  actions: read
jobs:
  # Job-level continue-on-error inside ci did not isolate cancelled street
  # observations (44139343442). Keep the whole macOS observation outside ci.
  nine-street:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: macos-15
    # 12 for the street and the probe; EM12's six native WebKit boots add up to ~12 more
    timeout-minutes: 25
    continue-on-error: true
    env:
      WS_LANE_NAME: nine-ring1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Select the exact Nine client source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: node scripts/nine-street-source.mjs
      - if: steps.source.outputs.artifact == 'true'
        uses: ./.github/actions/ring-setup
      - name: Own the advisory benchmark scratch folder
        if: steps.source.outputs.artifact == 'true'
        run: node scripts/scratch-dir.mjs nine-ring1 'NB6 report-only exact client street'
      - if: steps.source.outputs.artifact == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: nine-ring1-client
          path: tmp/nine-ring1
      - name: Restore the exact client and install Chromium
        if: steps.source.outputs.artifact == 'true'
        run: |
          mkdir -p tmp/nine-ring1/preview
          tar -xf tmp/nine-ring1/client.tar -C tmp/nine-ring1/preview
          rm tmp/nine-ring1/client.tar
          bash scripts/ci-playwright-install.sh chromium
      - name: Observe the unchanged Nine street ratchet
        id: street
        if: steps.source.outputs.artifact == 'true'
        continue-on-error: true
        shell: bash
        run: node scripts/nine-ring1.mjs bench 2>&1 | tee tmp/nine-ring1/street.log
      - name: Explain the hosted street limitation
        if: ${{ always() && steps.source.outputs.artifact == 'true' }}
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          STREET_OUTCOME: ${{ steps.street.outcome }}
        run: |
          echo "NB6 street: report-only on hosted virtualized Metal; source $SOURCE_SHA run $SOURCE_RUN; outcome $STREET_OUTCOME. Thresholds unchanged; real-GPU qualification open." >> "$GITHUB_STEP_SUMMARY"
          if [ "$STREET_OUTCOME" != success ]; then
            echo "::warning::NB6 street observation failed; inspect nine-ring1-street. Producer and props load remain blocking in ci."
          fi
      - name: Read the phone boot memory peak (MEMORY-GATES MG1, J408)
        id: memory
        if: steps.source.outputs.artifact == 'true'
        continue-on-error: true
        shell: bash
        run: |
          node scripts/nine-ring1.mjs memory 2>&1 | tee tmp/nine-ring1/memory.log
          grep '^BOOT MEMORY' tmp/nine-ring1/memory.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Install WebKit for the memory meter (ENGINE-MEMORY EM12)
        id: webkit
        if: steps.source.outputs.artifact == 'true'
        continue-on-error: true
        run: bash scripts/ci-playwright-install.sh webkit
      - name: Read native WebKit footprints, Template and Nine, 3 runs (ENGINE-MEMORY EM12 b)
        id: measure
        if: steps.source.outputs.artifact == 'true' && steps.webkit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node scripts/nine-ring1.mjs measure 2>&1 | tee tmp/nine-ring1/measure.log
      - name: Keep Nine street measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nine-ring1-street
          path: |
            tmp/nine-ring1/street.json
            tmp/nine-ring1/street.log
            tmp/nine-ring1/memory.json
            tmp/nine-ring1/memory.log
            tmp/nine-ring1/measure.log
            tmp/nine-ring1/measure-*.json
          retention-days: 7
          if-no-files-found: ignore

  memory-ledger:
    # ENGINE-MEMORY EM12 (a), report-only (J400 keeps it out of ci): Template's engine ledger [L] at control and at its
    # peak, in Chromium on SwiftShader, from the exact client ci built. Exact, so a later ratchet (EM35) can hold it.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    env:
      WS_LANE_NAME: nine-ring1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - name: Select the exact client source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: node scripts/nine-street-source.mjs
      - if: steps.source.outputs.artifact == 'true'
        uses: ./.github/actions/ring-setup
      - name: Own the scratch folder
        if: steps.source.outputs.artifact == 'true'
        run: node scripts/scratch-dir.mjs nine-ring1 'EM12 report-only ledger read'
      - if: steps.source.outputs.artifact == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          name: nine-ring1-client
          path: tmp/nine-ring1
      - name: Restore the exact client and install Chromium
        if: steps.source.outputs.artifact == 'true'
        run: |
          mkdir -p tmp/nine-ring1/preview
          tar -xf tmp/nine-ring1/client.tar -C tmp/nine-ring1/preview
          rm tmp/nine-ring1/client.tar
          bash scripts/ci-playwright-install.sh chromium
      - name: Read Brasscap's ledger at control and at its peak
        if: steps.source.outputs.artifact == 'true'
        shell: bash
        run: node scripts/nine-ring1.mjs ledger 2>&1 | tee tmp/nine-ring1/ledger.log
      - name: Keep the ledger read
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-ledger
          path: |
            tmp/nine-ring1/ledger.log
            tmp/nine-ring1/ledger-brasscap-mesa.json
          retention-days: 7
          if-no-files-found: ignore

  timings:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/timings
          key: timings-${{ github.event.workflow_run.id }}
          restore-keys: timings-
      - name: Select the actual code-proving source run (hosted fallback included)
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_OUTPUT,`run=${process.env.SOURCE_RUN}\n`);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
          pattern: engine-ci-*
          path: tmp/timings-run
      - name: Merge this run's measured files into the table
        id: collect
        run: node scripts/test-timings.mjs collect tmp/timings-run
      - if: steps.collect.outputs.measured == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp/timings
          key: timings-${{ github.event.workflow_run.id }}

  observations:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/ring-setup
        with:
          pins-cache-scope: full
      - name: Retain the observed source-run identity
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p tmp/ci-coverage-edges
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("tmp/ci-coverage-edges/source.json", JSON.stringify({run:process.env.SOURCE_RUN,sha:process.env.SOURCE_SHA,report:process.env.GITHUB_RUN_ID})+"\n")'
      - id: code
        run: echo 'run=true' >> "$GITHUB_OUTPUT"
      - run: pnpm pins && pnpm gen:inputs
      # TC39/J186: report-only, outside blocking wall accounting.
      # Review no earlier than 2026-11-23 after an actual green proof week.
      - name: Observe API health version reader over real HTTP
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TC39_INSTALLED_FORMAT: '1'
        run: node --test --test-timeout=10000 scripts/api-health.proof.ts
      # TC22/J186: report-only, outside the blocking share's wall budget.
      # Admission review no earlier than 2026-11-23 after a green week.
      - name: Observe nightly release refusal and planted failure
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: node --test --test-timeout=10000 scripts/release-nightly.proof.ts

      # TC7: new complete journeys report for a week before becoming gates.
      - name: Soak full Dunes and real pin-grid journeys
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        run: |
          node scripts/pins.ts install --ring 1
          node --import ./scripts/sim-node-loader.mjs --experimental-transform-types --test --test-reporter=tap test/ci/dunes-journey.proof.mjs test/ci/pin-grid-journey.proof.mjs
      # New coverage reports for a week before explicit blocking admission.
      # After wall accounting: report time cannot spend a blocking shard budget.
      - name: Soak named elite ownership on pinned products
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        run: |
          node scripts/pins.ts install --ring 1
          WILDSHARD_RING=1 node scripts/vitest-tmp.ts run test/roster-owners.proof.ts --reporter=default --reporter=json --outputFile.json=tmp/ci-coverage-edges/roster.json
      - name: Soak malformed nightly receipt refusal
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        run: |
          mkdir -p tmp/ci-coverage-edges
          NIGHTLY_IDENTITY_SOAK=1 node --test --test-name-pattern='extra receipt' scripts/nightly.proof.ts > tmp/ci-coverage-edges/identity.tap
      # TC8: exercise rejected live-clock admission without consuming a tap.
      - name: Soak hover presses across rejected network ticks
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/vitest-tmp.ts run test/net-hover-admission.proof.ts --reporter=default --reporter=json --outputFile.json=tmp/ci-coverage-edges/hover-admission.json
      - name: Keep non-blocking coverage edge observations
        if: ${{ !cancelled() && steps.code.outputs.run == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-edges-soak
          path: tmp/ci-coverage-edges
          retention-days: 14
      # EG-24: a new regression reports for one week before explicit admission.
      - name: Soak socket loss during combat and crossing
        if: steps.code.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/vitest-tmp.ts run test/dedicated-critical-reconnect.proof.ts --reporter=default --reporter=json --outputFile.json=tmp/ci-socket-soak/recovery.json
      - name: Keep socket recovery soak observations
        if: ${{ !cancelled() && steps.code.outputs.run == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: socket-recovery-soak
          path: tmp/ci-socket-soak
          retention-days: 14

      - name: Observe active quarantine with ordinary results
        continue-on-error: true
        run: node scripts/test-quarantine.mjs --shard=1/1
