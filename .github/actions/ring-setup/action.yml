name: ring-setup
description: >-
  What every Ring 1 job needs before scripts/ring1.sh: pnpm, node, the public
  org repos over HTTPS, and the pinned tarballs from the cache. It takes no
  secret, so a fork's pull request Jake has approved gets nothing it shouldn't.
inputs:
  pins-cache-scope:
    description: Separate full-product caches from Ring 1's smaller inventory.
    required: false
    default: ring
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - uses: ./.github/actions/org-deps
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/wildshard/pins
        key: ${{ inputs.pins-cache-scope }}-pins-${{ hashFiles('test/pins/slices.json', 'test/pins/shardfiles.json', 'test/pins/rings.json') }}
    # GVS G9 (J230): pnpm 10.34.9 turns the global virtual store off whenever ci is true; keep the runner's CI
    # environment and select only the installer layout, as the consumers do. setup-node caches that store.
    - run: pnpm install --frozen-lockfile --config.ci=false
      shell: bash
    - name: Prove the installed global store layout
      run: node scripts/assert-store-layout.mjs
      shell: bash
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/npm-bin-deps
        key: bin-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bin-deps/pnpm-lock.yaml', '.bin-deps/pnpm-workspace.yaml') }}
    - run: pnpm exec npr install --frozen
      shell: bash
